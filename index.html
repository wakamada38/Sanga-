<style>
:root{
  --green:#1a4d2e; --green-dark:#123620; --green-light:#2e6b45;
  --gold:#d4af37; --gold-light:#f0d878;
  --bg:#f5f3ec; --card:#ffffff; --text:#1e2a22; --muted:#6b7a70;
  --danger:#b3402f; --warn:#c98a1f; --ok:#2e7d4f; --border:#e2ddd0;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body.dark{
  --bg:#10160f; --card:#182018; --text:#eef0e8; --muted:#9aa89d; --border:#2b352c;
  --green:#2e6b45; --green-dark:#1a4d2e;
}
html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
body{padding-bottom:env(safe-area-inset-bottom); overscroll-behavior-y:contain;}
input,select,textarea,button{font-size:16px; font-family:inherit;}
header{background:linear-gradient(135deg,var(--green),var(--green-dark)); color:#fff; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top)); display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:50; box-shadow:0 2px 8px rgba(0,0,0,.2);}
header .logo{width:36px;height:36px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green-dark);flex-shrink:0;overflow:hidden;padding:1px;}
header .logo img{width:100%;height:100%;object-fit:contain;border-radius:8px;}
header h1{font-size:16px;margin:0;font-weight:700;flex:1;line-height:1.2;}
header .sub{font-size:11px;opacity:.85;font-weight:400;}
header .role-badge{background:rgba(255,255,255,.18); padding:4px 9px; border-radius:20px; font-size:11px;}
#syncDot{width:8px;height:8px;border-radius:50%;background:#7bd88f;display:inline-block;margin-right:4px;box-shadow:0 0 6px #7bd88f;}
#syncDot.off{background:#e05c5c;box-shadow:0 0 6px #e05c5c;}
main{padding:12px; padding-bottom:calc(20px + env(safe-area-inset-bottom)); max-width:900px; margin:0 auto; min-height:calc(100dvh - 130px);}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
@media(max-width:420px){.grid3{grid-template-columns:1fr 1fr;}}
.stat{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; text-align:center;}
.stat .num{font-size:24px; font-weight:800; color:var(--green); }
body.dark .stat .num{color:var(--gold-light);}
.stat .lbl{font-size:11px; color:var(--muted); margin-top:2px;}
.stat.danger .num{color:var(--danger);}
.stat.warn .num{color:var(--warn);}
h2.section{font-size:14px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:18px 4px 8px;}
label{display:block; font-size:12px; color:var(--muted); margin:8px 0 4px;}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text);
}
textarea{resize:vertical;}
button{cursor:pointer; border:none; border-radius:10px; padding:10px 14px; font-weight:600;}
.btn-primary{background:var(--green); color:#fff;}
.btn-gold{background:var(--gold); color:var(--green-dark);}
.btn-outline{background:transparent; border:1px solid var(--green); color:var(--green);}
body.dark .btn-outline{color:var(--gold-light); border-color:var(--gold-light);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:8px;}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.tabs{display:flex; overflow-x:auto; gap:6px; padding:8px 12px; background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:64px; z-index:40; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:8px 12px; border-radius:20px; background:var(--bg); color:var(--muted); font-size:12px; font-weight:600; white-space:nowrap; border:1px solid var(--border);}
.tab.active{background:var(--green); color:#fff; border-color:var(--green);}
table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--border);}
th{color:var(--muted); font-size:11px; text-transform:uppercase;}
.badge{padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700;}
.badge.ok{background:#dff3e6; color:var(--ok);}
.badge.warn{background:#fbeecd; color:var(--warn);}
.badge.danger{background:#f8ddd7; color:var(--danger);}
body.dark .badge.ok{background:#173321;} body.dark .badge.warn{background:#3a2e12;} body.dark .badge.danger{background:#3a1c17;}
.list-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.searchbar{display:flex; gap:8px; margin-bottom:10px;}
.searchbar input{flex:1;}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center; z-index:100;}
.modal-bg.show{display:flex;}
.modal{background:var(--card); width:100%; max-width:600px; max-height:90dvh; overflow-y:auto; border-radius:18px 18px 0 0; padding:18px; padding-bottom:calc(18px + env(safe-area-inset-bottom));}
.modal h3{margin-top:0;}
.close-x{float:right; background:var(--bg); border-radius:50%; width:30px; height:30px; text-align:center; line-height:30px; font-weight:700;}
.icon{font-size:18px;}
.chip{display:inline-block; background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:3px 10px; font-size:11px; margin:2px;}
.pin-screen{min-height:100dvh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:20px; text-align:center;}
.pin-screen input{width:180px; text-align:center; letter-spacing:6px; font-size:20px;}
.empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:13px;}
.toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--green-dark); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; z-index:200; opacity:0; transition:opacity .3s;}
.toast.show{opacity:1;}
.bar-row{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:12px;}
.bar-track{flex:1; background:var(--bg); border-radius:6px; height:14px; overflow:hidden;}
.bar-fill{height:100%; background:var(--green); border-radius:6px;}
a.linklike{color:var(--green); text-decoration:underline; cursor:pointer;}
body.dark a.linklike{color:var(--gold-light);}
#scannerOverlay{position:fixed; inset:0; background:#000; z-index:300; display:none; flex-direction:column;}
#scannerOverlay.show{display:flex;}
#scannerOverlay .scanner-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top)); color:#fff;}
#scannerOverlay .scanner-head button{background:rgba(255,255,255,.15); color:#fff; border-radius:50%; width:34px; height:34px; padding:0;}
#reader{flex:1; width:100%;}
#reader video{width:100% !important; height:100% !important; object-fit:cover;}
.scan-hint{color:#fff; text-align:center; padding:10px; font-size:12px; opacity:.85;}
.scan-btn-inline{display:flex; gap:6px;}
.scan-btn-inline input{flex:1;}

/* Hub-specific */
.hub-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
.hub-tile{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 12px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px;}
.hub-tile .hub-icon{font-size:30px;}
.hub-tile .hub-label{font-size:13px; font-weight:700;}
.hub-tile .hub-sub{font-size:10px; color:var(--muted);}
.hub-tile.disabled{opacity:.4;}
.perm-grid{width:100%; border-collapse:collapse; font-size:11px;}
.perm-grid th,.perm-grid td{padding:6px 4px; text-align:center; border-bottom:1px solid var(--border);}
.perm-grid td:first-child,.perm-grid th:first-child{text-align:left;}
</style>
</head>

/* ============ UTIL ============ */
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr,n){ const d=new Date(dateStr); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function migrateRolesShape(roles){
  // Older saved data used {modules:[...], editor:bool}. Convert to per-module {view,edit} perms.
  Object.keys(roles).forEach(key=>{
    const r = roles[key];
    if(!r.perms){
      const viewList = r.modules || [];
      const editList = key==='administrator' ? MODULES.map(m=>m.id) : (key!=='student' && r.editor ? viewList.filter(m=>m!=='payroll'&&m!=='fees') : []);
      r.perms = makePerms(viewList, editList);
    }
    // Backfill any module missing from perms (e.g. a module added after this role was created).
    MODULES.forEach(m=>{ if(!r.perms[m.id]) r.perms[m.id] = {view:false, edit:false}; });
  });
  return roles;
}
function roleModules(){
  const r = STATE.settings.roles[role];
  if(!r || !r.perms) return [];
  return MODULES.filter(m=>r.perms[m.id] && r.perms[m.id].view).map(m=>m.id);
}
function canOpenModule(modId){
  if(role==='administrator') return true;
  const r = STATE.settings.roles[role];
  return !!(r && r.perms && r.perms[modId] && r.perms[modId].view);
}
function hasFullAccess(modId){ return canOpenModule(modId); }
function canEditModule(modId){
  if(role==='administrator') return true;
  if(role==='student') return false; // Student always stays view-only by design
  const r = STATE.settings.roles[role];
  return !!(r && r.perms && r.perms[modId] && r.perms[modId].edit);
}
function can(action){
  // Only Administrator or a role granted "Can Edit" in Hub Settings may perform edit actions.
  return canEditModule("library");
}
function canManage(){
  // Adding new entries is open to any role with library "Can Edit" access (see can()).
  // Editing or deleting an existing entry is Administrator-only.
  return role === 'administrator';
}

/* ============ BOOK STATUS HELPERS ============ */
function bookCopiesAvailable(book){
  const issuedCount = STATE.transactions.filter(t=>t.bookId===book.id && t.status==='issued').length;
  return Math.max(0,(book.copies||1) - issuedCount - (book.lost||0) - (book.damaged||0));
}
function totalBooks(){ return STATE.books.reduce((a,b)=>a+(b.copies||1),0); }
function totalAvailable(){ return STATE.books.reduce((a,b)=>a+bookCopiesAvailable(b),0); }
function totalIssued(){ return STATE.transactions.filter(t=>t.status==='issued').length; }
function overdueList(){ return STATE.transactions.filter(t=>t.status==='issued' && t.dueDate < todayISO()); }
function fineFor(t){ if(t.status!=='issued'&&t.status!=='returned') return 0;
  const endDate = t.status==='returned' ? t.returnDate : todayISO();
  const late = daysBetween(t.dueDate, endDate);
  return late>0 ? late*(STATE.settings.library.fineDailyRate||0) : 0;
}

function captureFocus(){
  const el = document.activeElement;
  if(!el || !el.id || (el.tagName!=='INPUT' && el.tagName!=='TEXTAREA' && el.tagName!=='SELECT')) return null;
  return { id: el.id, start: el.selectionStart, end: el.selectionEnd };
}
function restoreFocus(saved){
  if(!saved) return;
  const el = document.getElementById(saved.id);
  if(!el) return;
  el.focus();
  if(typeof saved.start==='number' && el.setSelectionRange){
    try{ el.setSelectionRange(saved.start, saved.end); }catch(e){}
  }
}

function renderHub(){

  <div class="hub-grid">
    ${MODULES.map(mod=>{
      const openable = canOpenModule(mod.id);
      const full = hasFullAccess(mod.id);
      let sub = mod.type==='native' ? 'Built-in' : 'Opens linked app';
      if(mod.id==='library') sub = `${overdue.length} overdue`;
      if(mod.id==='treeCensus') sub = `${STATE.treeEntries.length} trees logged`;
      if(mod.id==='timetable79') sub = `${tt79Term} ${tt79Year}`;
      if(mod.id==='timetable46') sub = `${tt46Term} ${tt46Year}`;
      if(mod.id==='leaving') sub = `${currentOutRecords().length} currently out`;
      if(mod.id==='fees') sub = `${STATE.feesFamilies.length} families`;
      if(mod.id==='payroll') sub = `${STATE.payrollStaff.filter(s=>s.status==='Active').length} active staff`;
      if(mod.id==='expenses'){
        const inc = STATE.expenseRecords.filter(r=>r.type==='income').reduce((a,r)=>a+Number(r.amount||0),0);
        const exp = STATE.expenseRecords.filter(r=>r.type==='expense').reduce((a,r)=>a+Number(r.amount||0),0);
        sub = `Net ${fmtKES(inc-exp)}`;
      }
      if(mod.id==='suppliers'){
        const totalSpend = STATE.supplierRecords.reduce((a,r)=>a+Number(r.totalCost||0),0);
        sub = `${STATE.supplierRecords.length} deliveries · ${fmtKES(totalSpend)}`;
      }
      if(mod.id==='foodBudget') sub = `${FB_TERM_LABELS[fbTerm]} ${fbYear}`;
      if(mod.id==='documentsStore') sub = `${STATE.dsPartners.length} partners · ${STATE.dsDocuments.length} docs`;
      if(mod.id==='transferClearance'){
        const pending = STATE.transferRecords.filter(r=>tcComputeStatus(r)!=='done').length;
        sub = `${STATE.transferRecords.length} records · ${pending} pending`;
      }
      if(mod.id==='tscEntryExit') sub = 'Official Form D — Entry & Exit Report';
      if(mod.id==='textbooks'){
        const copies = STATE.textbookRecords.reduce((a,r)=>a+Number(r.learnerCopies||0),0);
        sub = `${STATE.textbookRecords.length} entries · ${copies} copies`;
      }
      if(mod.id==='feedingCalculator') sub = 'Ministry of Education feeding ratios';

      if(!openable) sub = 'Administrator only';
      else if(!full) sub += ' · View only';
      return `<div class="hub-tile ${openable?'':'disabled'}" onclick="${openable?`openModule('${mod.id}')`:`toast('Administrator access only')`}">

    if(key!=='administrator'){

      MODULES.forEach(m=>{
        const viewField = document.getElementById(`rv_${key}_${m.id}`);

  if(id && !canManage()){ toast('Editing requires Administrator access'); return; }
  const data = {

    title: document.getElementById('f_title').value.trim(),
    author: document.getElementById('f_author').value.trim(),
    publisher: document.getElementById('f_publisher').value.trim(),
    isbn: document.getElementById('f_isbn').value.trim(),
    barcode: document.getElementById('f_barcode').value.trim(),
    subject: document.getElementById('f_subject').value.trim(),

    shelf: document.getElementById('f_shelf').value.trim(),
    copies: parseInt(document.getElementById('f_copies').value)||1,
  };
  if(!data.title){ toast('Title is required'); return; }
  if(!STATE.categories.find(c=>c.name===data.category) && data.category){
    db.collection('library_categories').add({name:data.category});
  }
  if(!STATE.shelves.find(s=>s.name===data.shelf) && data.shelf){
    db.collection('library_shelves').add({name:data.shelf});
  }
  if(id){
    db.collection('library_books').doc(id).update(data);
    addNotification(`Updated book: ${data.title}`);
  } else {
    data.lost=0; data.damaged=0; data.donated=false;
    db.collection('library_books').add(data);
    addNotification(`New book added: ${data.title}`);
  }
  closeModal(); toast('Book saved');
}
function deleteBook(id){

}

/* ============ LIBRARY: TABLETS ============ */
const TABLET_CONDITIONS = ["Good","Needs Repair","Damaged","Lost"];
const IC_TO_LIB_CONDITION = {"New":"Good","Good":"Good","Fair":"Good","Needs Repair":"Needs Repair","Damaged":"Damaged","Lost":"Lost"};
let tabletSearch='';
function tabletActiveLoan(tabletId){ return STATE.tabletTransactions.find(t=>t.tabletId===tabletId && t.status==='issued'); }
function icTabletsPendingImport(){
  const existingTags = new Set(STATE.tablets.map(t=>(t.assetTag||'').toLowerCase()));
  const pending = [];
  (STATE.ictRecords||[]).filter(r=>r.gadgetType==='Tablet' && r.condition!=='Disposed').forEach(r=>{
    const qty = Number(r.qty)||1;
    for(let i=1;i<=qty;i++){
      const assetTag = qty>1 ? `${r.assetTag}-${i}` : r.assetTag;
      if(existingTags.has((assetTag||'').toLowerCase())) continue;
      pending.push({
        assetTag, model: r.makeModel || 'Tablet', serialNo: qty>1 ? '' : (r.serialNo||''),
        condition: IC_TO_LIB_CONDITION[r.condition] || 'Good',
        notes: `Imported from ICT Inventory (${r.assetTag})${r.location?' · '+r.location:''}`
      });
    }
  });
  return pending;
}
function importTabletsFromICT(){
  if(!can('tablets')){ toast('Edit access required'); return; }
  const pending = icTabletsPendingImport();
  if(!pending.length){ toast('No new tablets to import from ICT Inventory'); return; }
  if(!confirm(`Import ${pending.length} tablet${pending.length!==1?'s':''} from ICT Inventory into the Library?`)) return;
  const batch = db.batch();
  pending.forEach(p=> batch.set(db.collection('library_tablets').doc(), p));
  batch.commit().then(()=>{
    addNotification(`Imported ${pending.length} tablet(s) from ICT Inventory`);
    toast(`Imported ${pending.length} tablet(s)`);
  }).catch(err=>toast('Import failed: '+err.message));
}

  const q = tabletSearch.toLowerCase();
  const list = STATE.tablets.filter(t=> !q || [t.assetTag,t.model,t.serialNo].some(f=>(f||'').toLowerCase().includes(q)));

  return `

/* ============ BARCODE SCANNER ============ */
let html5QrCode = null;
let scanTargetField = null;
function startScanner(targetField){
  scanTargetField = targetField;
  const overlay = document.getElementById('scannerOverlay');
  overlay.classList.add('show');
  if(typeof Html5Qrcode === 'undefined'){
    toast('Scanner library failed to load — check your connection');
    overlay.classList.remove('show');
    return;
  }
  html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 12, qrbox: { width: 260, height: 140 },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  };
  html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, ()=>{})
    .catch(()=>{ toast('Could not access camera — check camera permission'); overlay.classList.remove('show'); });
}
function stopScanner(){
  const overlay = document.getElementById('scannerOverlay');
  if(html5QrCode){ html5QrCode.stop().then(()=>{ html5QrCode.clear(); html5QrCode=null; }).catch(()=>{ html5QrCode=null; }); }
  overlay.classList.remove('show');
}
function onScanSuccess(decodedText){
  stopScanner();
  const field = document.getElementById(scanTargetField);
  if(field) field.value = decodedText;
  toast('Scanned: '+decodedText);
  const digitsOnly = decodedText.replace(/[^0-9Xx]/g,'');
  if(digitsOnly.length===13 || digitsOnly.length===10){
    const isbnField = document.getElementById('f_isbn');
    if(isbnField && !isbnField.value) isbnField.value = digitsOnly;
    lookupISBN(digitsOnly);
  }
}
function lookupISBN(isbn){
  const status = document.getElementById('lookupStatus');
  if(status) status.textContent = 'Looking up book details…';
  fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`)
    .then(r=>r.json())
    .then(data=>{
      const info = data['ISBN:'+isbn];
      if(!info){ if(status) status.textContent='No match found online — enter details manually.'; return; }
      const titleF = document.getElementById('f_title'), authorF = document.getElementById('f_author'), subjF = document.getElementById('f_subject');
      if(titleF && !titleF.value && info.title) titleF.value = info.title;
      if(authorF && !authorF.value && info.authors && info.authors.length) authorF.value = info.authors.map(a=>a.name).join(', ');
      if(subjF && !subjF.value && info.subjects && info.subjects.length) subjF.value = info.subjects[0].name;
      if(status) status.textContent = 'Auto-filled from online lookup — please verify.';
    })
    .catch(()=>{ if(status) status.textContent = 'Lookup unavailable (offline) — enter details manually.'; });
}

function reportRows(kind){
  const today = todayISO();
  if(kind==='daily') return STATE.transactions.filter(t=>t.issueDate===today).map(t=>rowFor(t));
  if(kind==='monthly') return STATE.transactions.filter(t=>(t.issueDate||'').startsWith(today.slice(0,7))).map(t=>rowFor(t));
  if(kind==='overdue') return overdueList().map(t=>rowFor(t));
  if(kind==='inventory') return STATE.books.map(b=>({Title:b.title, Author:b.author||'', Category:b.category||'', Copies:b.copies||1, Available:bookCopiesAvailable(b), Lost:b.lost||0, Damaged:b.damaged||0}));
  if(kind==='tabletDaily') return STATE.tabletTransactions.filter(t=>t.issueDate===today).map(t=>tabletRowFor(t));
  if(kind==='tabletMonthly') return STATE.tabletTransactions.filter(t=>(t.issueDate||'').startsWith(today.slice(0,7))).map(t=>tabletRowFor(t));
  if(kind==='tabletOverdue') return tabletOverdueList().map(t=>tabletRowFor(t));
  if(kind==='tabletInventory') return STATE.tablets.map(t=>({AssetTag:t.assetTag||'—', Model:t.model||'—', SerialNo:t.serialNo||'—', Condition:t.condition||'Good', Status: tabletActiveLoan(t.id)?'Issued':'Available'}));
}
function rowFor(t){
  const b=STATE.books.find(x=>x.id===t.bookId), m=STATE.members.find(x=>x.id===t.memberId);
  return { Book:b?b.title:'—', Member:m?m.name:'—', Issued:fmtDate(t.issueDate), Due:fmtDate(t.dueDate), Status:t.status };
}
function tabletRowFor(t){
  const tab=STATE.tablets.find(x=>x.id===t.tabletId), m=STATE.members.find(x=>x.id===t.memberId);
  return { Tablet:tab?(tab.assetTag||tab.model):'—', Member:m?m.name:'—', Issued:fmtDate(t.issueDate), Due:fmtDate(t.dueDate), Status:t.status };
}

/* ============ TREE CENSUS ============ */
function legacyGetCollection(appName, config, collectionName, _isRetry){
  let legacyApp = firebase.apps.find(a=>a.name===appName);
  let isNew = false;
  if(!legacyApp){
    try{ legacyApp = firebase.initializeApp(config, appName); isNew = true; }
    catch(e){ return Promise.reject(e); }
  }
  const fs = legacyApp.firestore();
  if(isNew){
    // Some mobile carrier networks block Firestore's default streaming transport,
    // which surfaces as an "unavailable" error. Long-polling is slower but far more reliable on flaky mobile connections.
    try{ fs.settings({experimentalForceLongPolling:true, merge:true}); }catch(e){ console.warn('Could not set long-polling mode', e); }
  }
  const attempt = () => fs.collection(collectionName).get().catch(firstErr=>{
    console.warn('Direct read failed, trying anonymous sign-in fallback:', firstErr);
    return legacyApp.auth().signInAnonymously().then(()=> fs.collection(collectionName).get())
      .catch(secondErr=>{
        console.error('Anonymous sign-in fallback also failed:', secondErr);
        const combined = new Error((firstErr.code||firstErr.message)+' (direct read) / '+(secondErr.code||secondErr.message)+' (after sign-in attempt)');
        combined.code = secondErr.code || firstErr.code;
        throw combined;
      });
  });
  return attempt().catch(err=>{
    // "unavailable" is often transient (weak signal, carrier hiccup) — retry once automatically after a short pause.
    if(!_isRetry && (err.code==='unavailable' || /unavailable/i.test(err.message||''))){
      console.warn('Got "unavailable" — retrying once in 2s...');
      return new Promise(resolve=>setTimeout(resolve,2000)).then(()=> attempt());
    }
    throw err;
  });
}

  if(e.planted !== undefined && e.planted !== null && e.planted !== ''){

  }
  return [];

    }).join('') || `<div class="empty">No census recorded yet</div>`;

          <b>${esc(e.name||'Unnamed tree')}</b><br>

        </div>

      </div>
      <div class="row" style="margin-top:8px;"><span class="chip">Planted ${planted}</span><span class="chip">Surviving ${surviving}</span><span class="chip">${esc(censusLabel)}</span></div>
      <details style="margin-top:8px;"><summary style="font-size:11px; color:var(--green); cursor:pointer;">Census history (${hist.length})</summary>${histRows}</details>

        <button class="btn-sm btn-outline" onclick="openTreeCensusModal('${e.id}')">${canTreeEdit()?'+ Census':'View census'}</button>

}

function handleTreePhoto(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 480, scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      window._pendingTreePhoto = dataUrl;
      const prev = document.getElementById('treePhotoPreview');
      prev.outerHTML = `<img id="treePhotoPreview" src="${dataUrl}" style="width:64px;height:64px;border-radius:10px;object-fit:cover;">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveTreeCensus(id, editHistId){
  const e = STATE.treeEntries.find(x=>x.id===id); if(!e) return;
  const planted = Number(document.getElementById('c_planted').value)||0;
  const surviving = Number(document.getElementById('c_surviving').value)||0;
  if(surviving>planted){ toast("Surviving can't exceed planted"); return; }
  const migrated = (Array.isArray(e.censusHistory)&&e.censusHistory.length) ? e.censusHistory.slice() : getTreeHistory(e);
  let updated;
  const fields = { planted, surviving, month:document.getElementById('c_month').value, year:document.getElementById('c_year').value, term:document.getElementById('c_term').value, remarks:document.getElementById('c_remarks').value.trim() };
  if(editHistId){
    updated = migrated.map(h=> h.id===editHistId ? {...h, ...fields} : h);
  } else {
    updated = [...migrated, {id:'c'+uid(), ...fields, createdAt:Date.now()}];
  }
  db.collection('tree_entries').doc(id).update({
    censusHistory: updated,
    planted: firebase.firestore.FieldValue.delete(), surviving: firebase.firestore.FieldValue.delete(),
    censusMonth: firebase.firestore.FieldValue.delete(), censusYear: firebase.firestore.FieldValue.delete(),
    censusTerm: firebase.firestore.FieldValue.delete(), remarks: firebase.firestore.FieldValue.delete()
  });
  closeModal(); toast('Census saved');
}
function removeTreeHistory(id, histId){
  const e = STATE.treeEntries.find(x=>x.id===id); if(!e) return;
  const hist = getTreeHistory(e);
  if(hist.length<=1){ toast('Keep at least one census entry'); return; }
  if(!confirm('Remove this single census record?')) return;
  const updated = hist.filter(h=>h.id!==histId);
  db.collection('tree_entries').doc(id).update({
    censusHistory: updated,
    planted: firebase.firestore.FieldValue.delete(), surviving: firebase.firestore.FieldValue.delete(),
    censusMonth: firebase.firestore.FieldValue.delete(), censusYear: firebase.firestore.FieldValue.delete(),
    censusTerm: firebase.firestore.FieldValue.delete(), remarks: firebase.firestore.FieldValue.delete()
  });
}

function importLegacyTreeData(){
  if(!confirm('This copies all entries from the old Tree Census app into this hub. Continue?')) return;
  const status = document.getElementById('treeImportStatus');
  if(status) status.textContent = 'Connecting to old project…';
  legacyGetCollection('legacyTree', LEGACY_TREE_CONFIG, 'tree_census_entries')
    .then(snap=>{
      const existingLegacyIds = new Set(STATE.treeEntries.map(x=>x.legacyId).filter(Boolean));
      const toImport = snap.docs.filter(d=>!existingLegacyIds.has(d.id));
      if(!toImport.length){ if(status) status.textContent='Nothing new to import — already up to date.'; return; }
      if(status) status.textContent = `Importing ${toImport.length} record(s)…`;
      Promise.all(toImport.map(d=> db.collection('tree_entries').add({...d.data(), legacyId:d.id})))
        .then(()=>{ if(status) status.textContent = `Imported ${toImport.length} tree record(s).`; toast('Import complete'); })
        .catch(()=>{ if(status) status.textContent = 'Import failed partway — check connection and retry.'; });
    })
    .catch(err=>{ console.error(err); if(status) status.textContent = 'Could not read old project: '+(err.code||err.message||err)+'. If this says permission-denied, the old project Firestore rules block outside reads. If it says auth/admin-restricted-operation or operation-not-allowed, enable Anonymous sign-in in that old project Firebase Console under Authentication, Sign-in method.'; });
}

/* ============ TIMETABLE GRADE 7-9 ============ */
const TT79_GRADES = [7,8,9];
const TT79_DAYS = ["MON","TUE","WED","THU","FRI"];
const TT79_PERIODS = 8;
const TT79_REM = 3; // MRN, LUNC, EVE
const TT79_PERIOD_LABELS = ["8:00–8:40am","8:40–9:20am","9:40–10:20am","10:20–11:00am","11:30am–12:10pm","12:10–12:50pm","2:00–2:40pm","2:40–3:20pm"];
const TT79_REM_LABELS = ["MRN 7:00–8:00","LUNC 1:10–2:00","EVE 4:00–5:00"];
const TT79_DEFAULT_NOTES = { MON:"C & S", TUE:"G & S", WED:"G & C", THU:"Career Guidance", FRI:"PPI / General Cleanliness" };

let tt79Term = "Term 1";
let tt79Year = 2026;
let tt79Current = null;
let tt79Unsub = null;

function tt79BlankDay(){
  const g = {};
  TT79_GRADES.forEach(gr=>{ g[gr] = { periods: Array(TT79_PERIODS).fill(""), rem: Array(TT79_REM).fill("") }; });
  return g;
}
function tt79BlankTimetable(){
  const t = {};
  TT79_DAYS.forEach(d=>{ t[d] = tt79BlankDay(); });
  t.notes = Object.assign({}, TT79_DEFAULT_NOTES);
  return t;
}
function tt79Normalize(data){
  if(!data) return tt79BlankTimetable();
  TT79_DAYS.forEach(day=>{
    if(!data[day]) data[day] = tt79BlankDay();
    TT79_GRADES.forEach(g=>{
      if(!data[day][g]) data[day][g] = { periods: Array(TT79_PERIODS).fill(""), rem: Array(TT79_REM).fill("") };
      const p = Array.isArray(data[day][g].periods) ? data[day][g].periods.slice(0,TT79_PERIODS) : [];
      while(p.length<TT79_PERIODS) p.push("");
      data[day][g].periods = p;
      data[day][g].rem = Array.isArray(data[day][g].rem) && data[day][g].rem.length===TT79_REM ? data[day][g].rem : Array(TT79_REM).fill("");
    });
  });
  if(!data.notes) data.notes = Object.assign({}, TT79_DEFAULT_NOTES);
  return data;
}
function tt79StorageKey(term, year){ return term.replace(/\s+/g,"")+"_"+year; }
function tt79DocRef(){ return db.collection('timetable79').doc(tt79StorageKey(tt79Term, tt79Year)); }
function tt79CodeKey(str){ return (str||"").trim().toUpperCase(); }
function tt79TeacherKey(str){
  const s = (str||"").trim();
  if(!s) return "";
  const m = s.match(/(\d+)\s*$/);
  return m ? m[1] : s.toUpperCase();
}
function tt79FindClashes(day, kind, idx, grade){
  const code = kind==='period' ? tt79Current[day][grade].periods[idx] : tt79Current[day][grade].rem[idx];
  const key = tt79TeacherKey(code);
  if(!key) return [];
  const others = [];
  TT79_GRADES.forEach(g=>{
    if(String(g)===String(grade)) return;
    const val = kind==='period' ? tt79Current[day][g].periods[idx] : tt79Current[day][g].rem[idx];
    if(tt79TeacherKey(val)===key) others.push(g);
  });
  return others;
}
function tt79FindEmptySlot(day, grade, kind){
  const arr = kind==='period' ? tt79Current[day][grade].periods : tt79Current[day][grade].rem;
  for(let i=0;i<arr.length;i++){ if(!tt79CodeKey(arr[i])) return i; }
  return -1;
}
function tt79AutoResolve(day, kind, idx, editedGrade){
  const others = tt79FindClashes(day, kind, idx, editedGrade);
  const moves = []; const unresolved = [];
  others.forEach(g=>{
    const freeIdx = tt79FindEmptySlot(day, g, kind);
    if(freeIdx !== -1){
      if(kind==='period'){
        tt79Current[day][g].periods[freeIdx] = tt79Current[day][g].periods[idx];
        tt79Current[day][g].periods[idx] = "";
      } else {
        tt79Current[day][g].rem[freeIdx] = tt79Current[day][g].rem[idx];
        tt79Current[day][g].rem[idx] = "";
      }
      moves.push({grade:g, from:idx, to:freeIdx});
    } else { unresolved.push(g); }
  });
  return {moves, unresolved};
}
function tt79HasClash(day, kind, idx, grade){
  return tt79FindClashes(day, kind, idx, grade).length > 0;
}
function loadTT79(){
  if(tt79Unsub){ tt79Unsub(); tt79Unsub=null; }
  tt79Current = tt79BlankTimetable();
  tt79Unsub = tt79DocRef().onSnapshot(d=>{
    tt79Current = tt79Normalize(d.exists ? d.data() : null);
    if(view==='timetable79') render();
  });
}
function tt79Save(){ tt79DocRef().set(tt79Current); }
function renderTT79Grid(){
  const years=[]; for(let y=2026;y<=2030;y++) years.push(y);
  if(!tt79Current) tt79Current = tt79BlankTimetable();
  let rows = '';
  TT79_DAYS.forEach(day=>{
    TT79_GRADES.forEach((g,gi)=>{
      const isFirstRow = gi===0;
      rows += `<tr>${isFirstRow?`<td rowspan="${TT79_GRADES.length}" style="font-weight:700; writing-mode:vertical-rl; text-align:center;">${day}</td>`:''}<td style="font-weight:600;">Gr ${g}</td>`;
      if(isFirstRow) rows += `<td class="tt-brk" rowspan="${TT79_GRADES.length}">ASSEMBLY</td>`;
      for(let p=0;p<TT79_PERIODS;p++){
        const val = tt79Current[day][g].periods[p];
        const clash = tt79HasClash(day,'period',p,g);
        rows += `<td class="tt-cell ${clash?'tt-clash':''}" onclick="tt79EditCell('${day}','period',${p},${g})">${esc(val)}</td>`;
        if(p===1 && isFirstRow) rows += `<td class="tt-brk" rowspan="${TT79_GRADES.length}">BREAK</td>`;
        if(p===3 && isFirstRow) rows += `<td class="tt-brk" rowspan="${TT79_GRADES.length}">BREAK</td>`;
        if(p===5 && isFirstRow) rows += `<td class="tt-brk" rowspan="${TT79_GRADES.length}">LUNCH</td>`;
      }
      for(let r=0;r<TT79_REM;r++){
        const val = tt79Current[day][g].rem[r];
        const clash = tt79HasClash(day,'rem',r,g);
        rows += `<td class="tt-cell ${clash?'tt-clash':''}" onclick="tt79EditCell('${day}','rem',${r},${g})">${esc(val)}</td>`;
      }
      if(isFirstRow){
        const noteVal = (tt79Current.notes && tt79Current.notes[day]) || '';
        rows += `<td class="tt-note" rowspan="${TT79_GRADES.length}" ${canTT79Edit()?`onclick="tt79EditNote('${day}')"`:''}>${esc(noteVal)}</td>`;
      }
      rows += `</tr>`;
    });
  });

const TT46_GRADES = [4,5,6];
const TT46_DAYS = ["MON","TUE","WED","THU","FRI"];
const TT46_PERIODS = 8;
const TT46_PERIOD_LABELS = ["8:20–8:55am","8:55–9:30am","9:50–10:25am","10:25–11:00am","11:25am–12:00pm","12:00–12:35pm","2:00–2:35pm","2:35–3:10pm"];
const TT46_DEFAULT_NOTES = { MON:"Clubs", TUE:"Societies & Games", WED:"Sports", THU:"Guiding & Counselling", FRI:"Careers" };

let tt46Term = "Term 1";
let tt46Year = 2026;
let tt46Current = null;
let tt46Unsub = null;

function tt46BlankDay(){
  const g = {};
  TT46_GRADES.forEach(gr=>{ g[gr] = { periods: Array(TT46_PERIODS).fill("") }; });
  return g;
}
function tt46BlankTimetable(){
  const t = {};
  TT46_DAYS.forEach(d=>{ t[d] = tt46BlankDay(); });
  t.notes = Object.assign({}, TT46_DEFAULT_NOTES);
  return t;
}
function tt46Normalize(data){
  if(!data) return tt46BlankTimetable();
  TT46_DAYS.forEach(day=>{
    if(!data[day]) data[day] = tt46BlankDay();
    TT46_GRADES.forEach(g=>{
      if(!data[day][g]) data[day][g] = { periods: Array(TT46_PERIODS).fill("") };
      const p = Array.isArray(data[day][g].periods) ? data[day][g].periods.slice(0,TT46_PERIODS) : [];
      while(p.length<TT46_PERIODS) p.push("");
      data[day][g].periods = p;
    });
  });
  if(!data.notes) data.notes = Object.assign({}, TT46_DEFAULT_NOTES);
  return data;
}
function tt46StorageKey(term, year){ return term.replace(/\s+/g,"")+"_"+year; }
function tt46DocRef(){ return db.collection('timetable46').doc(tt46StorageKey(tt46Term, tt46Year)); }
function tt46CodeKey(str){ return (str||"").trim().toUpperCase(); }
function tt46TeacherKey(str){
  const s = (str||"").trim();
  if(!s) return "";
  const m = s.match(/(\d+)\s*$/);
  return m ? m[1] : s.toUpperCase();
}
function tt46FindClashes(day, idx, grade){
  const code = tt46Current[day][grade].periods[idx];
  const key = tt46TeacherKey(code);
  if(!key) return [];
  const others = [];
  TT46_GRADES.forEach(g=>{
    if(String(g)===String(grade)) return;
    if(tt46TeacherKey(tt46Current[day][g].periods[idx])===key) others.push(g);
  });
  return others;
}
function tt46FindEmptySlot(day, grade){
  const arr = tt46Current[day][grade].periods;
  for(let i=0;i<arr.length;i++){ if(!tt46CodeKey(arr[i])) return i; }
  return -1;
}
function tt46AutoResolve(day, idx, editedGrade){
  const others = tt46FindClashes(day, idx, editedGrade);
  const moves = []; const unresolved = [];
  others.forEach(g=>{
    const freeIdx = tt46FindEmptySlot(day, g);
    if(freeIdx !== -1){
      tt46Current[day][g].periods[freeIdx] = tt46Current[day][g].periods[idx];
      tt46Current[day][g].periods[idx] = "";
      moves.push({grade:g, from:idx, to:freeIdx});
    } else { unresolved.push(g); }
  });
  return {moves, unresolved};
}
function tt46HasClash(day, idx, grade){ return tt46FindClashes(day, idx, grade).length > 0; }
function loadTT46(){
  if(tt46Unsub){ tt46Unsub(); tt46Unsub=null; }
  tt46Current = tt46BlankTimetable();
  tt46Unsub = tt46DocRef().onSnapshot(d=>{
    tt46Current = tt46Normalize(d.exists ? d.data() : null);
    if(view==='timetable46') render();
  });
}

  if(status) status.textContent = 'Connecting to old project…';

const sigPads = {};
function initSigPad(id){
  const canvas = document.getElementById(id);
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientHeight * ratio;
  const ctx = canvas.getContext("2d");
  ctx.scale(ratio, ratio);
  ctx.strokeStyle = "#1b4332";
  ctx.lineWidth = 2.2;
  ctx.lineCap = "round";
  let drawing = false, last = null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e){ drawing = true; last = pos(e); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; e.preventDefault();
  }
  function end(){ drawing = false; }
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
  sigPads[id] = canvas;
}
function clearSig(id){
  const canvas = sigPads[id]; if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
function sigDataUrl(id){ return sigPads[id] ? sigPads[id].toDataURL("image/png") : ""; }
function isSigEmpty(id){
  const canvas = sigPads[id]; if(!canvas) return true;
  const ctx = canvas.getContext("2d");
  const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  for(let i=3;i<data.length;i+=4){ if(data[i]!==0) return false; }
  return true;
}

const FEES_TERM_LABELS = {term1:'Term 1', term2:'Term 2', term3:'Term 3'};
const FEES_LEGACY_TERM_NAMES = ['term1','term2','term3'];
let feesYear = '2026';
let feesTerm = 'term1';
let feesEditingLearners = [];
let feesEditingFamilyId = null;
let feesDetailId = null;
let feesDetailTab = 'parentFee';
let feesRecordContext = null;
let feesSearch = '', feesClassFilter = '';

function fmtKES(n){ n=Number(n)||0; return 'KES '+Math.round(n).toLocaleString('en-KE'); }
function fmtKg(n){ n=Number(n)||0; return (Math.round(n*10)/10)+' kg'; }
function feesTermKey(){ return feesYear+'_'+feesTerm; }
function feesPeriodLabel(){ return FEES_TERM_LABELS[feesTerm]+' · '+feesYear; }
function feesFindFamily(id){ return STATE.feesFamilies.find(f=>f.id===id); }
function feesFindLearner(fam, learnerId){ return fam.learners.find(l=>l.id===learnerId); }
function feesDefaultTermData(){ return { parentFee:{expected:0,paid:0,history:[]}, foodContribution:{targetKg:0,contributedKg:0,history:[]}, examFees:{} }; }
function feesEnsureTermData(fam, termKey){
  if(!fam.terms) fam.terms = {};
  if(!fam.terms[termKey]) fam.terms[termKey] = feesDefaultTermData();
  if(!fam.terms[termKey].parentFee) fam.terms[termKey].parentFee = {expected:0,paid:0,history:[]};
  if(!fam.terms[termKey].foodContribution) fam.terms[termKey].foodContribution = {targetKg:0,contributedKg:0,history:[]};
  if(!fam.terms[termKey].examFees) fam.terms[termKey].examFees = {};
  return fam.terms[termKey];
}
function feesEnsureLearnerExamFee(fam, termKey, learnerId){
  const t = feesEnsureTermData(fam, termKey);
  if(!t.examFees[learnerId]) t.examFees[learnerId] = {expected:0, paid:0, history:[]};
  return t.examFees[learnerId];
}
function feesMigrateFamilyIfNeeded(fam){
  let changed = false;
  if(!fam.terms){
    const legacyParentFee = fam.parentFee || {expected:0,paid:0,history:[]};
    const legacyFood = fam.foodContribution || {targetKg:0,contributedKg:0,history:[]};
    const t1ExamFees = {}, t2ExamFees = {};
    (fam.learners||[]).forEach(l=>{
      const exp = (l.examFee && l.examFee.expected) || 0;
      t1ExamFees[l.id] = l.examFee ? JSON.parse(JSON.stringify(l.examFee)) : {expected:0,paid:0,history:[]};
      t2ExamFees[l.id] = {expected: exp, paid:0, history:[]};
      delete l.examFee;
    });
    fam.terms = {
      term1: { parentFee: legacyParentFee, foodContribution: legacyFood, examFees: t1ExamFees },
      term2: { parentFee: {expected: legacyParentFee.expected||0, paid:0, history:[]}, foodContribution: {targetKg:0, contributedKg:0, history:[]}, examFees: t2ExamFees }
    };
    delete fam.parentFee; delete fam.foodContribution;
    changed = true;
  }
  const keys = Object.keys(fam.terms);
  const hasBareKeys = keys.some(k=>FEES_LEGACY_TERM_NAMES.includes(k));
  if(hasBareKeys){
    const renamed = {};
    keys.forEach(k=>{ renamed[FEES_LEGACY_TERM_NAMES.includes(k) ? ('2026_'+k) : k] = fam.terms[k]; });
    fam.terms = renamed;
    changed = true;
  }
  return changed;
}
function feesMoneyExpected(f, termKey){
  termKey = termKey || feesTermKey();
  const t = feesEnsureTermData(f, termKey);
  return (t.parentFee.expected||0) + f.learners.reduce((s,l)=>s+((t.examFees[l.id]&&t.examFees[l.id].expected)||0),0);
}
function feesMoneyPaid(f, termKey){
  termKey = termKey || feesTermKey();
  const t = feesEnsureTermData(f, termKey);
  return (t.parentFee.paid||0) + f.learners.reduce((s,l)=>s+((t.examFees[l.id]&&t.examFees[l.id].paid)||0),0);
}
function feesComputeStats(){
  const fams = STATE.feesFamilies;
  const totalFamilies = fams.length;
  const totalLearners = fams.reduce((s,f)=>s+f.learners.length,0);
  const totalPaid = fams.reduce((s,f)=>s+feesMoneyPaid(f),0);
  const totalExpected = fams.reduce((s,f)=>s+feesMoneyExpected(f),0);
  const totalBalance = fams.reduce((s,f)=>s+Math.max(feesMoneyExpected(f)-feesMoneyPaid(f),0),0);
  const totalFoodKg = fams.reduce((s,f)=>s+(feesEnsureTermData(f,feesTermKey()).foodContribution.contributedKg||0),0);
  return {totalFamilies, totalLearners, totalPaid, totalBalance, totalFoodKg};
}
function feesSaveFamily(f){ db.collection('fees_families').doc(f.id).set(f); }

function saveFeesFamily(){
  const parent = document.getElementById('ff_parent').value.trim();
  if(!parent){ toast('Parent name is required'); return; }
  const contact = document.getElementById('ff_contact').value.trim();
  const parentFeeExpected = parseFloat(document.getElementById('ff_pfexpected').value)||0;
  const foodTarget = parseFloat(document.getElementById('ff_foodtarget').value)||0;
  const remarks = document.getElementById('ff_remarks').value.trim();
  feesEditingLearners.forEach(l=>{ if(!l.id) l.id = 'l_'+Date.now()+'_'+Math.floor(Math.random()*1000); });

  let savedFamily;
  if(feesEditingFamilyId){
    const f = feesFindFamily(feesEditingFamilyId);
    f.parent=parent; f.contact=contact; f.remarks=remarks;
    const termData = feesEnsureTermData(f, feesTermKey());
    const keepIds = new Set();
    feesEditingLearners.forEach(el=>{
      keepIds.add(el.id);
      let learner = f.learners.find(x=>x.id===el.id);
      if(!learner){ learner={id:el.id,name:'',class:'',sex:'M'}; f.learners.push(learner); }
      learner.name=el.name; learner.class=el.class; learner.sex=el.sex;
      const ef = feesEnsureLearnerExamFee(f, feesTermKey(), el.id);
      ef.expected = el.examFeeExpected||0;
    });
    f.learners = f.learners.filter(l=>keepIds.has(l.id));
    termData.parentFee.expected = parentFeeExpected;
    termData.foodContribution.targetKg = foodTarget;
    savedFamily = f;
  } else {
    const learners = feesEditingLearners.map(el=>({id:el.id,name:el.name,class:el.class,sex:el.sex}));
    const examFeesTerm = {};
    feesEditingLearners.forEach(el=>{ examFeesTerm[el.id] = {expected: el.examFeeExpected||0, paid:0, history:[]}; });
    savedFamily = {
      id: 'fam_'+Date.now(), parent, contact, remarks, learners,
      terms: { [feesTermKey()]: { parentFee:{expected:parentFeeExpected,paid:0,history:[]}, foodContribution:{targetKg:foodTarget,contributedKg:0,history:[]}, examFees: JSON.parse(JSON.stringify(examFeesTerm)) } }
    };
    STATE.feesFamilies.push(savedFamily);
  }
  feesSaveFamily(savedFamily);
  closeModal(); toast('Family saved');
}

function saveFeesRecord(){
  if(!feesRecordContext) return;
  const f = feesFindFamily(feesRecordContext.familyId);
  if(!f) return;
  const amount = parseFloat(document.getElementById('fr_amount').value);
  if(!amount || amount<=0){ toast('Enter a valid amount'); return; }
  const date = document.getElementById('fr_date').value;
  const receiptField = document.getElementById('fr_receipt');
  const receipt = receiptField ? receiptField.value.trim() : '';
  const note = document.getElementById('fr_note').value.trim();
  const termData = feesEnsureTermData(f, feesTermKey());
  if(feesRecordContext.type==='parentFee'){
    termData.parentFee.history = termData.parentFee.history||[];
    termData.parentFee.history.push({amount,date,receipt,note});
    termData.parentFee.paid = (termData.parentFee.paid||0)+amount;
    toast('Parent fee payment recorded ('+feesPeriodLabel()+')');
  } else if(feesRecordContext.type==='examFee'){
    const ef = feesEnsureLearnerExamFee(f, feesTermKey(), feesRecordContext.learnerId);
    ef.history = ef.history||[]; ef.history.push({amount,date,receipt,note});
    ef.paid = (ef.paid||0)+amount;
    toast('Exam fee payment recorded ('+feesPeriodLabel()+')');
  } else if(feesRecordContext.type==='food'){
    termData.foodContribution.history = termData.foodContribution.history||[];
    termData.foodContribution.history.push({kg:amount,date,note});
    termData.foodContribution.contributedKg = (termData.foodContribution.contributedKg||0)+amount;
    toast('Food contribution logged');
  }
  feesSaveFamily(f);
  closeModal();
}

function generateFeesRegisterPdf(){

  const green=[27,77,62];

  doc.setFont(undefined,'normal');

    const learnerStr = f.learners.map(l=>l.name+' (Gr.'+l.class+')').join(', ');
    doc.text(String(f.parent).substring(0,26),colX[0],y);
    doc.text(String(f.contact||'-').substring(0,18),colX[1],y);

    doc.text(learnerLines[0]||'',colX[2],y);
    doc.text('KES '+Math.round(expected).toLocaleString('en-KE'),colX[3],y);
    doc.text('KES '+Math.round(paid).toLocaleString('en-KE'),colX[4],y);
    doc.text('KES '+Math.round(balance).toLocaleString('en-KE'),colX[5],y);
    doc.text(String(Math.round((feesEnsureTermData(f,feesTermKey()).foodContribution.contributedKg||0)*10)/10),colX[6],y);
    y += (learnerLines.length>1 ? 5*learnerLines.length : 7);
  });
  const stats = feesComputeStats();
  if(y>185){ doc.addPage(); y=15; }
  y+=6; doc.setDrawColor(...green); doc.line(10,y,287,y); y+=7;
  doc.setFont(undefined,'bold');

  doc.save(`Sanga_Fees_Register_${todayISO()}.pdf`);
}

function importLegacyFeesData(){
  if(!confirm('This copies all families from the old Fees / Parents Register app into this hub. Continue?')) return;
  const status = document.getElementById('feesImportStatus');
  if(status) status.textContent = 'Connecting to old project…';
  legacyGetCollection('legacyFees', LEGACY_FEES_CONFIG, 'families')
    .then(snap=>{
      const existingIds = new Set(STATE.feesFamilies.map(x=>x.id));
      const toImport = snap.docs.filter(d=>!existingIds.has(d.id));
      if(!toImport.length){ if(status) status.textContent='Nothing new to import — already up to date.'; return; }
      if(status) status.textContent = `Importing ${toImport.length} famil${toImport.length===1?'y':'ies'}…`;
      Promise.all(toImport.map(d=>{
        const data = d.data();
        feesMigrateFamilyIfNeeded(data);
        return db.collection('fees_families').doc(d.id).set(data);
      }))
        .then(()=>{ if(status) status.textContent = `Imported ${toImport.length} famil${toImport.length===1?'y':'ies'}.`; toast('Import complete'); })
        .catch(()=>{ if(status) status.textContent = 'Import failed partway — check connection and retry.'; });
    })
    .catch(err=>{ console.error(err); if(status) status.textContent = 'Could not read old project: '+(err.code||err.message||err)+'. If this says permission-denied, the old project Firestore rules block outside reads. If it says auth/admin-restricted-operation or operation-not-allowed, enable Anonymous sign-in in that old project Firebase Console under Authentication, Sign-in method.'; });
}

/* ============ PAYROLL ============ */
const PAYROLL_ROLES = ["Teacher","Cook","Watchman","Matron","Groundskeeper","Driver","Bursar/Admin","Cleaner","Other"];
let payrollPeriod = (()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
let currentPayrollStaffId = null;

function payrollMoney(n){ n=Number(n)||0; return 'KES '+n.toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function payrollPeriodLabel(p){
  const [y,m] = p.split('-');
  const names=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return names[parseInt(m,10)-1]+' '+y;
}
function payrollNewStaffId(){ return 'st_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function calcAllowances(p){ return (p.allowHouse||0)+(p.allowTransport||0)+(p.allowOther||0); }
function calcOvertime(p){ return p.overtimeManual!=null && p.overtimeManual!=='' ? Number(p.overtimeManual) : (Number(p.otHours||0)*Number(p.otRate||0)); }
function calcGross(p){ return Number(p.basicSalary||0)+calcAllowances(p)+calcOvertime(p); }
function calcDeductions(p){ return (p.dedAdvance||0)+(p.dedNSSF||0)+(p.dedNHIF||0)+(p.dedOther||0); }
function calcNet(p){ return calcGross(p)-calcDeductions(p); }
function canPayrollEdit(){ return canEditModule('payroll'); }
function payrollForPeriod(period){
  const out = {};
  STATE.payrollRecords.filter(r=>r.period===period).forEach(r=>{ out[r.staffId] = r; });
  return out;
}
function payrollSaveStaff(id, data){ db.collection('payroll_staff').doc(id).set({...data, updatedAt: Date.now()}); }
function payrollSaveRecord(period, staffId, data){
  db.collection('payroll_records').doc(period+'__'+staffId).set({...data, period, staffId, updatedAt: Date.now()});
}

function savePayrollStaff(existingId){
  const name = document.getElementById('ps_name').value.trim();
  if(!name){ toast('Name is required'); return; }
  const data = {
    name, role: document.getElementById('ps_role').value, status: document.getElementById('ps_status').value,
    phone: document.getElementById('ps_phone').value.trim(), idNumber: document.getElementById('ps_idnum').value.trim(),
    dateJoined: document.getElementById('ps_joined').value, basicSalary: parseFloat(document.getElementById('ps_salary').value)||0
  };
  const advInput = document.getElementById('ps_advbal');
  if(advInput) data.advanceBalance = parseFloat(advInput.value)||0;
  const id = existingId || payrollNewStaffId();
  payrollSaveStaff(id, data);
  closeModal(); toast('Staff saved');
}
function deletePayrollStaff(id){
  if(!confirm('Delete this staff member? Their past payroll records are kept.')) return;
  db.collection('payroll_staff').doc(id).delete();
  closeModal(); toast('Staff deleted');
}
function recordAdvance(id){
  const s = STATE.payrollStaff.find(x=>x.id===id);
  if(!s) return;
  const current = s.advanceBalance||0;
  const input = prompt(`Record a new salary advance for ${s.name}.\nCurrent outstanding balance: ${payrollMoney(current)}\n\nEnter the NEW advance amount to add (KES):`);
  if(input===null) return;
  const amt = parseFloat(input);
  if(!amt || amt<=0){ toast('Enter a valid amount'); return; }
  const {id:_drop, ...staffData} = s;
  const newBalance = current + amt;
  payrollSaveStaff(id, {...staffData, advanceBalance:newBalance});
  toast(`Advance of ${payrollMoney(amt)} recorded — balance now ${payrollMoney(newBalance)}`);
}

function payrollUpdatePreview(){
  const p = payrollReadForm();
  const el = document.getElementById('pp_netpreview');
  if(el) el.textContent = payrollMoney(calcNet(p));
  const remEl = document.getElementById('pp_advanceRemaining');
  if(remEl){
    const s = STATE.payrollStaff.find(x=>x.id===currentPayrollStaffId);
    if(s) remEl.textContent = 'Remaining balance after this deduction: '+payrollMoney(Math.max(0,(s.advanceBalance||0)-(p.dedAdvance||0)));
  }
}
function savePayrollRecord(staffId, viewPayslip){
  const p = payrollReadForm();
  const existing = payrollForPeriod(payrollPeriod)[staffId];
  const prevAdvance = existing ? (existing.dedAdvance||0) : 0;
  const delta = (p.dedAdvance||0) - prevAdvance;
  const s = STATE.payrollStaff.find(x=>x.id===staffId);
  let newBalance = s ? (s.advanceBalance||0) : 0;
  if(delta !== 0 && s){
    newBalance = Math.max(0, newBalance - delta);
    const {id:_drop, ...staffData} = s;
    payrollSaveStaff(staffId, {...staffData, advanceBalance:newBalance});
  }
  p.advanceBalanceAfter = newBalance;
  payrollSaveRecord(payrollPeriod, staffId, p);
  closeModal(); toast('Payroll saved');
  if(viewPayslip) setTimeout(()=>showPayslip(staffId),200);
}
function renderPayrollReports(){

    let gross=0, ded=0, net=0, count=0;
    Object.values(data).forEach(p=>{ gross+=calcGross(p); ded+=calcDeductions(p); net+=calcNet(p); count++; });
    return `<tr><td>${payrollPeriodLabel(per)}</td><td>${count}</td><td>${payrollMoney(gross)}</td><td>${payrollMoney(ded)}</td><td><b>${payrollMoney(net)}</b></td></tr>`;
  }).join('');
  const currentData = payrollForPeriod(payrollPeriod);
  return `
  <h2 class="section">Payroll History</h2>
  <div class="card">${periods.length? `<table><tr><th>Period</th><th>Staff</th><th>Gross</th><th>Deductions</th><th>Net</th></tr>${rows}</table>` : '<div class="empty">No payroll processed yet</div>'}</div>

function downloadPayslipPDF(staffId){
  const s = STATE.payrollStaff.find(x=>x.id===staffId);
  const p = payrollForPeriod(payrollPeriod)[staffId];
  if(!s||!p){ toast('No payroll processed for this period'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const margin=50;
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(27,67,50);
  doc.text("SANG'A COMPREHENSIVE SCHOOL", 297, 60, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(100,100,100);
  doc.text('Payslip - '+payrollPeriodLabel(payrollPeriod), 297, 78, {align:'center'});
  try{ doc.addImage(SCHOOL_LOGO, 'PNG', margin, 24, 40, 40); }catch(e){}
  doc.setDrawColor(212,175,55); doc.setLineWidth(2); doc.line(margin, 90, 545, 90);
  let y=118;
  doc.setFontSize(11); doc.setTextColor(0,0,0);
  doc.setFont('helvetica','bold'); doc.text('Employee:', margin, y); doc.setFont('helvetica','normal'); doc.text(s.name, margin+90, y); y+=16;
  doc.setFont('helvetica','bold'); doc.text('Role:', margin, y); doc.setFont('helvetica','normal'); doc.text(s.role, margin+90, y); y+=16;
  doc.setFont('helvetica','bold'); doc.text('ID No.:', margin, y); doc.setFont('helvetica','normal'); doc.text(s.idNumber||'-', margin+90, y); y+=28;
  function sectionHeader(label){ doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(27,67,50); doc.text(label.toUpperCase(), margin, y); y+=6; doc.setDrawColor(200,200,200); doc.line(margin,y+4,545,y+4); y+=18; }
  function row(label, amount, bold){ doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(10); doc.setTextColor(0,0,0); doc.text(label, margin, y); doc.text(payrollMoney(amount), 545, y, {align:'right'}); y+=16; }
  function totalRow(label, amount){ doc.setDrawColor(27,67,50); doc.line(margin,y-6,545,y-6); row(label, amount, true); y+=4; }
  sectionHeader('Earnings');
  row('Basic Salary', p.basicSalary); row('House Allowance', p.allowHouse); row('Transport Allowance', p.allowTransport); row('Other Allowance', p.allowOther); row('Overtime', calcOvertime(p));
  totalRow('Gross Pay', calcGross(p)); y+=10;
  sectionHeader('Deductions');
  row('Salary Advance', p.dedAdvance);
  if(p.advanceBalanceAfter>0){ doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(120,120,120); doc.text('Advance balance remaining: '+payrollMoney(p.advanceBalanceAfter), margin, y); y+=14; doc.setTextColor(0,0,0); }
  row('NSSF', p.dedNSSF); row('NHIF / SHIF', p.dedNHIF); row('Other', p.dedOther);
  totalRow('Total Deductions', calcDeductions(p)); y+=20;
  doc.setFillColor(212,175,55); doc.rect(margin, y-24, 495, 44, 'F');
  doc.setTextColor(30,30,30); doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text('NET PAY', 297, y-8, {align:'center'});

function handleExpenseReceipt(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 900, scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      window._pendingReceipt = dataUrl;
      const row = document.getElementById('exp_receipt_row');
      if(row){
        row.innerHTML = `
          ${renderReceiptPreview(dataUrl)}
          <button class="btn-outline btn-sm" type="button" onclick="document.getElementById('exp_receipt_input').click()">Replace</button>
          <button class="btn-outline btn-sm" type="button" onclick="clearExpenseReceipt()">Remove</button>
          <input type="file" id="exp_receipt_input" accept="image/*" capture="environment" style="display:none;" onchange="handleExpenseReceipt(event)">
        `;
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveSupplierEntry(){
  const nameSel = document.getElementById('sup_name').value;
  const supplierName = nameSel==='__new__' ? document.getElementById('sup_name_new').value.trim() : nameSel;
  const contact = document.getElementById('sup_contact').value.trim();
  const idNo = document.getElementById('sup_idno').value.trim();
  const date = document.getElementById('sup_date').value || todayISO();
  const item = document.getElementById('sup_item').value.trim();
  const unit = document.getElementById('sup_unit').value.trim();
  const qty = Number(document.getElementById('sup_qty').value)||0;
  const cost = Number(document.getElementById('sup_cost').value)||0;
  const status = document.getElementById('sup_status').value;
  const totalCost = qty*cost;
  if(!supplierName){ toast('Select or enter a supplier name'); return; }
  if(!item){ toast('Enter the item supplied'); return; }
  if(!qty || qty<=0){ toast('Enter a valid quantity'); return; }
  if(!cost || cost<=0){ toast('Enter a valid cost'); return; }
  const dir = supplierDirectory();
  if(!dir.some(s=>s.name===supplierName)){
    STATE.settings.suppliers = {...STATE.settings.suppliers, directory:[...dir, {name:supplierName, contact}]};
    saveSettings();
  } else if(contact){
    const updated = dir.map(s=> s.name===supplierName ? {...s, contact} : s);
    STATE.settings.suppliers = {...STATE.settings.suppliers, directory:updated};
    saveSettings();
  }
  if(supSelectedId){
    db.collection('suppliers_records').doc(supSelectedId).update({supplierName, contact, idNo, date, item, unit, qty, cost, totalCost, status, updatedAt:Date.now()});
    toast('Record updated');
  } else {
    const id = uid();
    db.collection('suppliers_records').doc(id).set({supplierName, contact, idNo, date, item, unit, qty, cost, totalCost, status, createdAt:Date.now(), updatedAt:Date.now()});
    toast('Record saved');
  }
  supClearForm();
  setTab('records');
}

function generateSuppliersPdf(){
  const q = supSearch.toLowerCase();
  let items = STATE.supplierRecords.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  items = items.filter(r=>supInSelectedTerm(r.date));
  if(supFilterName) items = items.filter(r=>r.supplierName===supFilterName);
  if(supFilterStatus) items = items.filter(r=>(r.status||'Pending')===supFilterStatus);
  if(q) items = items.filter(r=>(r.supplierName||'').toLowerCase().includes(q) || (r.item||'').toLowerCase().includes(q) || (r.contact||'').toLowerCase().includes(q));
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
  leavePdfHeader(doc, `Suppliers Register — ${supPeriodLabel()}`);
  const rows = items.map(r=>[fmtDate(r.date), r.supplierName, r.idNo||'', r.contact||'', r.item, r.qty, r.unit, fmtKES(r.cost), fmtKES(r.totalCost), r.status||'Pending']);
  doc.autoTable({
    startY:60, head:[['Date','Supplier','ID No','Contact','Item','Qty','Unit','Cost','Total Cost','Status']], body: rows,
    styles:{fontSize:8, cellPadding:4, valign:'middle'}, headStyles:{fillColor:[27,67,50], textColor:255},
    alternateRowStyles:{fillColor:[246,245,240]},
    columnStyles:{7:{halign:'right'}, 8:{halign:'right'}},
    margin:{left:16,right:16},
    didDrawPage: function(){
      const t = supplierTotals(items);
      const y = doc.internal.pageSize.getHeight()-24;
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(27,67,50);
      doc.text(`Deliveries: ${t.count}   Total: ${fmtKES(t.total)}`, 16, y);
    }
  });
  doc.save(`Sanga_Suppliers_${supYear}_${supTerm}.pdf`);
}

function generateTextbooksPdf(){

}
function downloadTextbooksCSV(){
  const q = tbSearch.toLowerCase();
  let items = STATE.textbookRecords.slice();
  if(tbFilterGrade) items = items.filter(r=>r.grade===tbFilterGrade);
  if(q) items = items.filter(r=> [r.bookTitle,r.learningArea,r.publisher,r.classTeacher,r.email].some(f=>(f||'').toLowerCase().includes(q)));
  const headers = ["Date","Grade","Learning Area","Book Title","Publisher","Learner Copies","Teacher Guides","Class Teacher","Email"];
  const lines = [headers.join(',')];
  items.forEach(r=>{
    const row = [r.date,r.grade,r.learningArea,r.bookTitle,r.publisher,r.learnerCopies,r.teacherGuides,r.classTeacher,r.email];
    lines.push(row.map(v=>`"${(v??'').toString().replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='sanga_textbooks_inventory.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('CSV downloaded');
}

function tbParseQty(v){
  if(v===undefined || v===null) return 0;
  const raw = String(v).trim();
  if(raw==='') return 0;
  const s = raw.toLowerCase().replace(/\s+/g,'').replace(/\./g,'');
  if(s==='na' || s==='n/a') return 0;
  const m = raw.match(/[\d.]+/);
  return m ? parseFloat(m[0]) : 0;
}
function tbParseDate(v){
  const raw = (v||'').trim().split(' ')[0];
  const m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){
    const mm = m[1].padStart(2,'0'); const dd = m[2].padStart(2,'0'); const yyyy = m[3];
    return `${yyyy}-${mm}-${dd}`;
  }
  return todayISO();
}
function tbParseBulkText(raw){
  const lines = raw.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  let start = 0;
  const first = lines[0].toLowerCase();
  if(first.includes('grade') && (first.includes('book') || first.includes('learning'))) start = 1;
  const out = [];
  for(let i=start;i<lines.length;i++){
    const cols = lines[i].split('\t');
    while(cols.length < 11) cols.push('');
    const bookTitle = (cols[5]||'').trim();
    const learningArea = (cols[4]||'').trim();
    if(!bookTitle && !learningArea) continue;
    out.push({
      date: tbParseDate(cols[2]),
      grade: (cols[3]||'').trim(),
      learningArea,
      bookTitle,
      publisher: (cols[6]||'').trim(),
      learnerCopies: tbParseQty(cols[7]),
      teacherGuides: tbParseQty(cols[8]),
      classTeacher: (cols[9]||'').trim(),
      email: (cols[10]||'').trim() || (cols[1]||'').trim()
    });
  }
  return out;
}

  if(!canTextbooksEdit()){ toast('Edit access required'); return; }
  if(!records.length){ toast('No valid rows found to import'); return; }
  if(!confirm(`Import ${records.length} book entries into Text Books Inventory? This cannot be undone automatically.`)) return;
  const now = Date.now();
  let batch = db.batch();
  let ops = 0;
  const promises = [];
  records.forEach(rec=>{
    const id = uid();
    batch.set(db.collection('textbooks_records').doc(id), {...rec, createdAt: now, updatedAt: now});
    ops++;
    if(ops>=400){ promises.push(batch.commit()); batch = db.batch(); ops=0; }
  });
  if(ops>0) promises.push(batch.commit());
  Promise.all(promises).then(()=>{
    toast(`Imported ${records.length} book entries`);
    setTab('records');
  }).catch(err=>{
    console.error(err);
    toast('\u26a0\ufe0f Import failed \u2014 check your connection and try again');
  });
}

const FC_OFFICIAL_ITEMS = [
  {id:'maize', name:'Maize', gramsPerChild:150},
  {id:'beans', name:'Beans', gramsPerChild:70},
  {id:'fatOil', name:'Fat / Oil', gramsPerChild:8},
  {id:'salt', name:'Salt', gramsPerChild:0.5},
];
const FC_PERIODS = [
  {id:'day', label:'1 Day', days:1},
  {id:'week', label:'1 Week (5 days)', days:5},
  {id:'month', label:'1 Month (20 days)', days:20},
  {id:'term', label:'1 Term (60 days)', days:60},
];
const FC_NAV = [{id:'calculator', icon:'🍚', label:'Calculator', need:null}];
let fcCurrent = null;
let fcUnsub = null;
function fcVisibleNav(){ return FC_NAV; }
function canFeedingCalcEdit(){ return canEditModule('feedingCalculator'); }
function fcDocRef(){ return db.collection('meta').doc('feedingCalculator'); }
function fcBlank(){ return { learners:220, period:'day', officialPrices:{}, customFoods:[] }; }
function fcNormalize(data){
  if(!data) return fcBlank();
  return {
    learners: Number(data.learners)||0,
    period: FC_PERIODS.some(p=>p.id===data.period) ? data.period : 'day',
    officialPrices: data.officialPrices || {},
    customFoods: Array.isArray(data.customFoods) ? data.customFoods.map(f=>({
      id: f.id||uid(), name: f.name||'Food', gramsPerChild: Number(f.gramsPerChild)||0, price: Number(f.price)||0
    })) : []
  };
}
function loadFeedingCalculator(){
  if(fcUnsub){ fcUnsub(); fcUnsub=null; }
  fcCurrent = fcBlank();
  fcUnsub = fcDocRef().onSnapshot(d=>{
    fcCurrent = fcNormalize(d.exists ? d.data() : null);
    if(view==='feedingCalculator') render();
  });
}
function fcSave(){ fcDocRef().set(fcCurrent); }
function fcAllItems(){
  const official = FC_OFFICIAL_ITEMS.map(it=>({
    id:it.id, name:it.name, gramsPerChild:it.gramsPerChild,
    price: Number((fcCurrent.officialPrices||{})[it.id])||0, official:true
  }));
  const custom = (fcCurrent.customFoods||[]).map(f=>({...f, official:false}));
  return [...official, ...custom];
}
function fcPeriodDays(){ const p = FC_PERIODS.find(p=>p.id===fcCurrent.period); return p?p.days:1; }
function fcCompute(){
  const days = fcPeriodDays();
  const learners = Number(fcCurrent.learners)||0;
  const rows = fcAllItems().map(it=>{
    const totalKg = (it.gramsPerChild * learners * days) / 1000;
    const hasPrice = Number(it.price) > 0;
    const cost = hasPrice ? totalKg * Number(it.price) : 0;
    return {...it, totalKg, hasPrice, cost};
  });
  const totalFood = rows.reduce((a,r)=>a+r.totalKg,0);
  const totalCost = rows.reduce((a,r)=>a+r.cost,0);
  return { days, learners, rows, totalFood, totalCost };
}
function fcSetOfficialPrice(id, val){ fcCurrent.officialPrices = {...(fcCurrent.officialPrices||{}), [id]: Number(val)||0}; }
function fcSetCustomPrice(id, val){ fcCurrent.customFoods = (fcCurrent.customFoods||[]).map(f=> f.id===id ? {...f, price:Number(val)||0} : f); }
function fcSetLearners(val){ fcCurrent.learners = Number(val)||0; }
function fcSetPeriod(id){
  if(!canFeedingCalcEdit()){ toast('Edit access required'); return; }
  fcCurrent.period = id; fcSave(); render();
}
function fcAddCustomFood(){
  if(!canFeedingCalcEdit()){ toast('Edit access required'); return; }

  const price = Number(document.getElementById('fc_new_price').value)||0;
  if(!name){ toast('Enter a food name'); return; }
  if(!grams || grams<=0){ toast('Enter grams per child'); return; }
  fcCurrent.customFoods = [...(fcCurrent.customFoods||[]), {id:uid(), name, gramsPerChild:grams, price}];
  fcSave();
  toast('Food added');
  render();
}
function fcRemoveCustomFood(id){
  if(!canFeedingCalcEdit()){ toast('Edit access required'); return; }
  if(!confirm('Remove this food item?')) return;
  fcCurrent.customFoods = (fcCurrent.customFoods||[]).filter(f=>f.id!==id);
  fcSave();
  toast('Food removed');

}

function reallyDeleteICTAsset(id){

function icFilteredRecords(){
  const q = icSearch.toLowerCase();
  let items = STATE.ictRecords.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(icFilterType) items = items.filter(r=>r.gadgetType===icFilterType);
  if(icFilterCondition) items = items.filter(r=>r.condition===icFilterCondition);
  if(q) items = items.filter(r=> [r.assetTag,r.gadgetType,r.makeModel,r.serialNo,r.personResponsible,r.location].some(f=>(f||'').toLowerCase().includes(q)));
  return items;
}

function generateICTPdf(){
  const items = icFilteredRecords().slice().sort((a,b)=>(a.gadgetType||'').localeCompare(b.gadgetType||''));
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
  leavePdfHeader(doc, 'ICT Gadgets Inventory Register');
  const rows = items.map(r=>[r.assetTag, r.gadgetType, r.makeModel||'', r.serialNo||'', r.qty??0, r.source||'', r.location||'', r.condition||'', r.personResponsible||'', r.value?icFmtKES(r.value):'—']);
  doc.autoTable({
    startY:60, head:[['Asset Tag','Gadget','Make/Model','Serial No.','Qty','Source','Location','Condition','Person','Value']], body: rows,
    styles:{fontSize:7.5, cellPadding:4}, headStyles:{fillColor:[27,67,50], textColor:255},
    alternateRowStyles:{fillColor:[246,245,240]}, margin:{left:16,right:16},
    didDrawPage: function(){
      const t = icTotals(items);
      const y = doc.internal.pageSize.getHeight()-24;
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(27,67,50);
      doc.text(`Records: ${t.count}   Units: ${t.qty}   Value: ${icFmtKES(t.value)}`, 16, y);
    }
  });
  doc.save('Sanga_ICT_Inventory.pdf');
}
function downloadICTCSV(){
  const items = icFilteredRecords();
  const headers = ["Asset Tag","ICT Gadget","Make/Model","Serial No.","Qty","Source/Origin","Date Received","Location","Condition","Person Responsible","Purchase/Donation Ref.","Estimated Value (KSh)","Last Verified","Remarks"];
  const lines = [headers.join(',')];
  items.forEach(r=>{
    const row = [r.assetTag,r.gadgetType,r.makeModel,r.serialNo,r.qty,r.source,r.dateReceived,r.location,r.condition,r.personResponsible,r.purchaseRef,r.value,r.lastVerified,r.remarks];
    lines.push(row.map(v=>`"${(v??'').toString().replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='sanga_ict_inventory.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('CSV downloaded');
}

}

    menu: JSON.parse(JSON.stringify(FB_DEFAULT_MENU))
  };

function fbNormalize(data){
  if(!data) return fbBlank();
  const out = {
    weeks: Number(data.weeks) || 14,
    income: Number(data.income) || 0,
    items: Array.isArray(data.items) && data.items.length ? data.items.map(it=>({
      id: it.id || uid(),
      name: it.name || 'Untitled',
      bagSize: Number(it.bagSize) || 0,
      qtyPerDay: Number(it.qtyPerDay) || 0,
      daysPerWeek: Number(it.daysPerWeek) || 0,
      pricePerBag: Number(it.pricePerBag) || 0,
      pinned: !!it.pinned
    })) : JSON.parse(JSON.stringify(FB_DEFAULT_ITEMS)),
    menu: data.menu || JSON.parse(JSON.stringify(FB_DEFAULT_MENU))
  };
  FB_DAYS.forEach(d=>{ if(!out.menu[d]) out.menu[d] = {breakfast:'',lunch:'',supper:''}; });
  return out;
}
function loadFoodBudget(){
  if(fbUnsub){ fbUnsub(); fbUnsub=null; }
  fbCurrent = fbBlank();
  fbSelectedIdx = 0;
  fbUnsub = fbDocRef().onSnapshot(d=>{
    fbCurrent = fbNormalize(d.exists ? d.data() : null);
    if(fbSelectedIdx >= fbCurrent.items.length) fbSelectedIdx = Math.max(0, fbCurrent.items.length-1);
    if(view==='foodBudget') render();
  });
}

function fbCalcItem(it){
  const totalKg = it.qtyPerDay * it.daysPerWeek * fbCurrent.weeks;
  const bags = it.bagSize>0 ? Math.ceil((totalKg/it.bagSize)*100)/100 : 0;
  const amount = bags * it.pricePerBag;
  return {totalKg, bags, amount};
}
function fbTotals(){
  let totalKg=0, totalAmount=0;
  fbCurrent.items.forEach(it=>{ const c = fbCalcItem(it); totalKg+=c.totalKg; totalAmount+=c.amount; });
  return {totalKg, totalAmount};
}

    <textarea id="ds_up_desc" rows="2" placeholder="Short note"></textarea>
    <label>File (max 10 MB)</label>
    <input type="file" id="ds_up_file" onchange="dsHandleFile(event)">
    <div id="ds_up_preview" style="font-size:12px; color:var(--muted); margin-top:6px;"></div>
    <div id="ds_up_progress_wrap" style="display:none; margin-top:8px;">
      <div style="height:8px; background:var(--bg); border-radius:6px; overflow:hidden;">
        <div id="ds_up_progress_bar" style="height:100%; width:0%; background:var(--ok, #1e6b4f); transition:width .2s;"></div>
      </div>
      <div id="ds_up_progress_text" style="font-size:11px; color:var(--muted); margin-top:4px;"></div>
    </div>
    <div class="row" style="margin-top:14px; justify-content:flex-end;">
      <button class="btn-outline" onclick="dsCancelUpload()">Cancel</button>
      <button class="btn-primary" id="ds_up_submit" onclick="dsSubmitUpload()">Upload</button>
    </div>
  `;
