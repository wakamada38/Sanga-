}
function dsFmtBytes(n){ n=Number(n)||0; return n<1024 ? n+'B' : n<1048576 ? (n/1024).toFixed(1)+' KB' : (n/1048576).toFixed(1)+' MB'; }
function dsSetPreview(text, isError){
  const preview = document.getElementById('ds_up_preview');
  if(!preview) return;
  preview.textContent = text;
  preview.style.color = isError ? 'var(--danger)' : 'var(--muted)';
}
function dsHandleFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  if(file.size > DS_MAX_BYTES){
    dsPendingFile = null;
    dsSetPreview(`${file.name} (${dsFmtBytes(file.size)}) — too large. Maximum upload size is ${dsFmtBytes(DS_MAX_BYTES)}.`, true);
    evt.target.value = '';
    return;
  }
  dsPendingFile = file;
  dsSetPreview(`${file.name} (${dsFmtBytes(file.size)})`, false);
}
function dsCancelUpload(){
  if(dsUploadXhr){
    dsUploadCancelled = true;
    dsUploadXhr.abort();
    dsUploadXhr = null;
    toast('Upload cancelled');
  }
  closeModal();
}
function dsSubmitUpload(){
  const pid = document.getElementById('ds_up_pid').value;
  const title = document.getElementById('ds_up_title').value.trim();
  const desc = document.getElementById('ds_up_desc').value.trim();
  if(!pid){ toast('Please select a partner drawer'); return; }
  if(!title){ toast('Please enter a document title'); return; }
  if(!dsPendingFile){ toast('Please select a file'); return; }
  if(dsPendingFile.size > DS_MAX_BYTES){ toast(`File is too large (max ${dsFmtBytes(DS_MAX_BYTES)})`); return; }
  const ext = (dsPendingFile.name.split('.').pop()||'').toLowerCase();
  const type = DS_EXT_TYPE[ext] || 'pdf';
  // Cloudinary expects ordinary PDFs/docs through resource_type "auto" (it classifies a normal
  // PDF as "image" internally) — forcing "raw" is only correct for encrypted/password-protected
  // PDFs, and sending a normal PDF there is what was causing uploads to hang instead of failing cleanly.
  const resourceType = 'auto';
  document.getElementById('ds_up_submit').disabled = true;
  const progressWrap = document.getElementById('ds_up_progress_wrap');
  if(progressWrap) progressWrap.style.display = 'block';
  dsRunUpload({pid, title, desc, type, resourceType, attempt:1});
}
function dsRunUpload(job){
  const submitBtn = document.getElementById('ds_up_submit');
  const progressBar = document.getElementById('ds_up_progress_bar');
  const progressText = document.getElementById('ds_up_progress_text');
  const progressWrap = document.getElementById('ds_up_progress_wrap');
  const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${job.resourceType}/upload`;
  const formData = new FormData();
  formData.append('file', dsPendingFile);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  formData.append('folder', `documents_store/${job.pid}`);

  const xhr = new XMLHttpRequest();
  dsUploadXhr = xhr;
  xhr.open('POST', url, true);
  xhr.timeout = 120000; // 2 min — generous for a slow mobile connection
  xhr.upload.onprogress = e=>{
    if(!e.lengthComputable) return;
    const pct = Math.round((e.loaded / e.total) * 100);
    if(progressBar) progressBar.style.width = pct + '%';
    if(progressText) progressText.textContent = `Uploading… ${pct}% (${dsFmtBytes(e.loaded)} / ${dsFmtBytes(e.total)})`;
  };
  xhr.onload = ()=>{
    dsUploadXhr = null;
    let resp;
    try{ resp = JSON.parse(xhr.responseText); }catch(e){ resp = null; }
    if(xhr.status < 200 || xhr.status >= 300 || !resp || !resp.secure_url){
      toast('Upload failed: '+(resp&&resp.error&&resp.error.message ? resp.error.message : ('HTTP '+xhr.status)));
      if(document.getElementById('ds_up_submit')) document.getElementById('ds_up_submit').disabled = false;
      if(progressWrap) progressWrap.style.display = 'none';
      return;
    }
    try{
      db.collection('ds_documents').add({
        pid: job.pid, title: job.title, desc: job.desc, type: job.type,
        date: new Date().toISOString().slice(0,10),
        fileName: dsPendingFile.name, fileSize: dsPendingFile.size,
        cloudinaryUrl: resp.secure_url, cloudinaryPublicId: resp.public_id, cloudinaryResourceType: job.resourceType,
        createdAt: Date.now()
      }).then(()=>{
        closeModal(); toast('Document uploaded');
      }).catch(err=>{
        toast('Save failed: '+err.message);
        if(document.getElementById('ds_up_submit')) document.getElementById('ds_up_submit').disabled = false;
      });
    }catch(err){
      // The file uploaded fine at this point — this only guards the record-save step, so a bug
      // here surfaces as a toast instead of leaving the modal stuck on "Uploading... 100%" forever.
      console.error(err);
      toast('Upload succeeded but saving the record failed: ' + err.message);
      if(document.getElementById('ds_up_submit')) document.getElementById('ds_up_submit').disabled = false;
      if(progressWrap) progressWrap.style.display = 'none';
    }
  };
  const handleDropped = (reason)=>{
    dsUploadXhr = null;
    if(dsUploadCancelled){ dsUploadCancelled = false; return; } // user cancelled — abort() also fires onerror, but nothing more to do here
    if(job.attempt < 2){
      // Mobile connections often drop mid-upload for a moment — retry once automatically before bothering the user.
      if(progressText) progressText.textContent = 'Connection dropped — retrying…';
      setTimeout(()=>{ dsRunUpload({...job, attempt: job.attempt+1}); }, 1500);
      return;
    }
    toast(reason==='timeout'
      ? 'Upload timed out — try again on a stronger connection (Wi-Fi if possible)'
      : 'Upload failed — check your connection and try again (Wi-Fi is more reliable for larger files)');
    if(document.getElementById('ds_up_submit')) document.getElementById('ds_up_submit').disabled = false;
    if(progressWrap) progressWrap.style.display = 'none';
  };
  xhr.onerror = ()=> handleDropped('network');
  xhr.ontimeout = ()=> handleDropped('timeout');
  xhr.send(formData);
}

function dsReallyDeletePartner(pid){
  const batch = db.batch();

  batch.commit().then(()=>{
    if(dsSelectedPid===pid) dsSelectedPid = null;
    toast('Partner and its documents deleted');
  });
}
function dsDeleteDocument(id){
  if(!canDSEdit()){ toast('Edit access required'); return; }
  const d = STATE.dsDocuments.find(x=>x.id===id); if(!d) return;
  // Note: unsigned Cloudinary uploads can't be deleted from client-side code (that needs your API
  // secret, which must never be exposed in the app). This removes the record from the register;
  // the file itself stays in your Cloudinary media library (well within the free plan's 25 GB) until
  // you delete it manually there, or add a small server-side helper later if you want automatic cleanup.
  openConfirmModal({
    title: 'Delete document?',
    message: `Delete "${d.title}"? This removes it from the register (the file will still exist in Cloudinary). This cannot be undone here.`,
    confirmLabel: 'Delete Document',
    onConfirm: `dsReallyDeleteDocument('${id}')`
  });
}
function dsReallyDeleteDocument(id){
  db.collection('ds_documents').doc(id).delete().then(()=>toast('Document deleted'));
}

/* ---- View / download ---- */
function dsOpenView(id){
  const d = STATE.dsDocuments.find(x=>x.id===id); if(!d) return;
  const ti = DS_TYPE_ICON[d.type] || DS_TYPE_ICON.pdf;
  const dataUrl = d.cloudinaryUrl || d.downloadURL || d.fileData; // current uploads use Cloudinary; older ones may have Storage/inline data
  let bodyHtml;
  if(!dataUrl){
    bodyHtml = `<p style="color:var(--muted);">No file attached.</p>`;
  } else if(d.type==='img'){
    bodyHtml = `<img src="${dataUrl}" alt="${esc(d.title)}" style="max-width:100%; border-radius:8px;">`;
  } else if(d.type==='pdf'){
    bodyHtml = `<iframe src="${dataUrl}" title="${esc(d.title)}" style="width:100%; height:60vh; border:1px solid var(--border); border-radius:8px;"></iframe>`;
  } else {
    bodyHtml = `<div style="text-align:center; padding:24px 0;">
      <div style="font-size:44px; margin-bottom:10px;">${ti[0]}</div>
      <p style="color:var(--muted);">${esc(d.fileName||d.title)}</p>
      <p style="font-size:12px; color:var(--muted);">This file type can't be previewed here. Use Download to open it.</p>
    </div>`;
  }
  document.getElementById('modalBody').innerHTML = `
    <span class="close-x" onclick="closeModal()">✕</span>
    <h3>${esc(d.title)}</h3>
    <div style="font-size:12px; color:var(--muted); margin-bottom:10px;">${esc(d.desc||'')}${d.fileName?' · '+esc(d.fileName):''}</div>
    ${bodyHtml}
    <div class="row" style="margin-top:14px; justify-content:flex-end;">
      ${dataUrl?`<a class="btn-primary" href="${dataUrl}" download="${esc(d.fileName||d.title)}" style="text-decoration:none;">⬇ Download</a>`:''}
    </div>
  `;
  showModal();
}

function tcBlankRecord(){
  return {
    createdAt: Date.now(),
    teacher: {fullName:"",tscNumber:"",idPassport:"",designation:"",currentStation:"",countySubCounty:"",newStation:"",effectiveDate:""},

    certification: {headName:"",signature:"",date:"",stamped:false}
  };
}
function tcComputeStatus(r){
  const declDone = !!(r.declaration && r.declaration.signature && r.declaration.date);
  const certDone = !!(r.certification && r.certification.signature && r.certification.date);
  if(certDone) return "done";
  if(declDone || (r.officers||[]).some(o=>o.signature)) return "progress";
  return "draft";
}

/* ---- Shared officer/teacher names list (dropdown + management) ---- */
function tcOfficerNames(){ return STATE.settings.tcOfficerNames || []; }
function tcAddOfficerName(name){
  const trimmed = (name||'').trim();
  if(!trimmed) return false;
  const list = tcOfficerNames();
  if(!list.some(n=> n.toLowerCase()===trimmed.toLowerCase())){
    list.push(trimmed);
    STATE.settings.tcOfficerNames = list;
    saveSettings();
  }
  return true;
}
function tcRenameOfficerName(oldName, newName){
  const trimmed = (newName||'').trim();
  if(!trimmed || trimmed.toLowerCase()===oldName.toLowerCase()) return;
  const list = tcOfficerNames();
  const idx = list.findIndex(n=> n===oldName);
  if(idx > -1) list[idx] = trimmed;
  STATE.transferRecords.forEach(r=>{
    (r.officers||[]).forEach(o=>{
      if(o.name && o.name.trim().toLowerCase()===oldName.toLowerCase()) o.name = trimmed;
    });
  });
  STATE.settings.tcOfficerNames = list;
  saveSettings();
  if(tcCurrentRecord){
    (tcCurrentRecord.officers||[]).forEach(o=>{
      if(o.name && o.name.trim().toLowerCase()===oldName.toLowerCase()) o.name = trimmed;
    });
  }
}
function tcDeleteOfficerName(name){
  STATE.settings.tcOfficerNames = tcOfficerNames().filter(n=> n!==name);
  saveSettings();
}
function tcRenderNamesList(){
  const list = tcOfficerNames();
  if(list.length === 0) return `<div class="empty">No names saved yet. Add one below.</div>`;
  return list.map(n=>`
    <div class="row" style="justify-content:space-between; border-bottom:1px solid var(--border); padding:7px 0;">
      <input type="text" value="${esc(n)}" style="flex:1; border:none; background:transparent;" onchange="tcRenameOfficerName('${esc(n).replace(/'/g,"\\'")}', this.value); openTCNamesModal();">
      <button class="btn-sm btn-danger" onclick="if(confirm('Remove &quot;${esc(n)}&quot; from the list? Existing records keep their saved name.')){ tcDeleteOfficerName('${esc(n).replace(/'/g,"\\'")}'); openTCNamesModal(); }">✕</button>
    </div>`).join('');
}
function openTCNamesModal(){
  document.getElementById('modalBody').innerHTML = `

function tcNewRecord(){ if(!canTCInitiate()){ toast('Only the Administrator can start a new clearance form'); return; } tcCurrentRecord = tcBlankRecord(); tcStep = 0; tcExpandedOfficer = null; setTab('form'); }
function tcOpenRecord(id){
  const r = STATE.transferRecords.find(x=>x.id===id);
  if(!r) return;
  tcCurrentRecord = JSON.parse(JSON.stringify(r));
  (tcCurrentRecord.officers||[]).forEach(o=>{

function tcDeleteRecord(id){
  if(!canTCInitiate()){ toast('Only the Administrator can delete a clearance record'); return; }

/* ---- Register (list) ---- */
function renderTCRegister(){
  let list = STATE.transferRecords.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(tcSearchTerm){
    const q = tcSearchTerm.toLowerCase();
    list = list.filter(r=> (r.teacher.fullName||'').toLowerCase().includes(q) || (r.teacher.tscNumber||'').toLowerCase().includes(q) || (r.teacher.newStation||'').toLowerCase().includes(q));
  }
  let html = `
  <div class="card">
    <input type="text" id="tcSearchInput" placeholder="Search by name, TSC no, new station..." value="${esc(tcSearchTerm)}" oninput="tcSearchTerm=this.value; render();">
    ${canTCInitiate() ? `<button class="btn-primary" style="width:100%; margin-top:10px;" onclick="tcNewRecord()">+ New Transfer Clearance Form</button>` : `<div style="font-size:11.5px; color:var(--muted); margin-top:8px;">🔒 Only the Administrator can start a new clearance form.</div>`}
  </div>`;
  if(!list.length){
    html += `<div class="empty">No clearance records yet.${canTCInitiate() ? ' Tap "+ New Transfer Clearance Form" to begin.' : ''}</div>`;
    return html;
  }
  html += list.map(r=>{
    const st = tcComputeStatus(r);
    const badgeClass = st==='done'?'ok':st==='progress'?'warn':'danger';
    const label = st==='done'?'Completed':st==='progress'?'In progress':'Draft';
    const hasNotCleared = (r.officers||[]).some(o=> o.clearance === 'Not cleared');
    return `<div class="card">
      <div style="font-weight:700; font-size:14px;">${esc(r.teacher.fullName||'Unnamed teacher')}</div>
      <div style="font-size:11.5px; color:var(--muted); margin-top:2px;">TSC: ${esc(r.teacher.tscNumber||'—')} · ${esc(r.teacher.currentStation||'—')} → ${esc(r.teacher.newStation||'—')}</div>
      <div style="font-size:11.5px; color:var(--muted);">Effective: ${esc(r.teacher.effectiveDate||'—')}</div>
      <span class="badge ${badgeClass}" style="margin-top:6px; display:inline-block;">${label}</span>
      ${hasNotCleared ? `<span class="badge danger" style="margin-top:6px; margin-left:6px; display:inline-block;">⚠ Not Cleared</span>` : ''}
      <div class="row" style="margin-top:10px;">
        <button class="btn-sm btn-outline" onclick="tcOpenRecord('${r.id}')">${canTCEdit()?'Open':'View'}</button>
        <button class="btn-sm btn-outline" onclick="tcExportPDF('${r.id}')">📄 PDF</button>
        ${canTCInitiate() ? `<button class="btn-sm btn-danger" onclick="tcDeleteRecord('${r.id}')">Delete</button>` : ''}
      </div>    </div>`;
  }).join('');
  html += `<button class="btn-outline" style="width:100%; margin-top:4px;" onclick="tcExportBulkPDF()">📄 Export Full Register (PDF)</button>`;
  return html;
}

/* ---- Form (stepper, sections A-F) ---- */
function tcSyncFromDOM(){
  if(!tcCurrentRecord) return;
  const r = tcCurrentRecord;
  const g = id => document.getElementById(id);
  if(g('tc_fullName')) r.teacher.fullName = g('tc_fullName').value;
  if(g('tc_tscNumber')) r.teacher.tscNumber = g('tc_tscNumber').value;
  if(g('tc_idPassport')) r.teacher.idPassport = g('tc_idPassport').value;
  if(g('tc_designation')) r.teacher.designation = g('tc_designation').value;
  if(g('tc_currentStation')) r.teacher.currentStation = g('tc_currentStation').value;
  if(g('tc_countySubCounty')) r.teacher.countySubCounty = g('tc_countySubCounty').value;
  if(g('tc_newStation')) r.teacher.newStation = g('tc_newStation').value;
  if(g('tc_effectiveDate')) r.teacher.effectiveDate = g('tc_effectiveDate').value;
  r.checklist.forEach((c,i)=>{ if(g('tc_cl_remarks_'+i)) c.remarks = g('tc_cl_remarks_'+i).value; });
  if(g('tc_handedOverTo')) r.handover.handedOverTo = g('tc_handedOverTo').value;
  if(g('tc_designationTscNo')) r.handover.designationTscNo = g('tc_designationTscNo').value;
  if(g('tc_dateOfHandover')) r.handover.dateOfHandover = g('tc_dateOfHandover').value;
  if(g('tc_outstandingMatters')) r.handover.outstandingMatters = g('tc_outstandingMatters').value;
  if(g('tc_declDate')) r.declaration.date = g('tc_declDate').value;
  r.officers.forEach((o,i)=>{
    if(g('tc_off_area_'+i)) o.area = g('tc_off_area_'+i).value;
    if(g('tc_off_name_'+i)) o.name = g('tc_off_name_'+i).value;
    if(g('tc_off_tscNo_'+i)) o.tscNo = g('tc_off_tscNo_'+i).value;
    if(g('tc_off_date_'+i)) o.date = g('tc_off_date_'+i).value;
    if(g('tc_off_stamped_'+i)) o.stamped = g('tc_off_stamped_'+i).checked;
    if(g('tc_off_clearance_'+i)) o.clearance = g('tc_off_clearance_'+i).value;
    if(g('tc_off_comment_'+i)) o.comment = g('tc_off_comment_'+i).value;
  });
  if(g('tc_headName')) r.certification.headName = g('tc_headName').value;
  if(g('tc_certDate')) r.certification.date = g('tc_certDate').value;
  if(g('tc_certStamped')) r.certification.stamped = g('tc_certStamped').checked;
}
function tcFinalizeExpandedOfficerSig(){
  if(tcExpandedOfficer !== null && tcCurrentRecord){
    const o = tcCurrentRecord.officers[tcExpandedOfficer];
    if(o) o.signature = tcSigOrExisting('tc_sig_off_'+tcExpandedOfficer, o.signature);
  }
}
function tcGoStep(i){ tcSyncFromDOM(); tcFinalizeExpandedOfficerSig(); tcExpandedOfficer = null; tcStep = i; render(); }
function tcSetChecklist(i, field, val){
  tcSyncFromDOM();
  tcCurrentRecord.checklist[i][field] = val;
  render();
}
function tcSigOrExisting(id, existing){ return isSigEmpty(id) ? existing : sigDataUrl(id); }
function tcClearSigField(id, path){
  clearSig(id);
  const parts = path.split('.');
  let obj = tcCurrentRecord;
  for(let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
  obj[parts[parts.length-1]] = '';
  render();
}
function tcToggleOfficer(i){
  tcSyncFromDOM();
  if(tcExpandedOfficer === i){
    tcFinalizeExpandedOfficerSig();
    tcExpandedOfficer = null;
  }else{
    tcFinalizeExpandedOfficerSig();
    tcExpandedOfficer = i;
  }
  render();
}
function initTCSigPads(){
  if(!tcCurrentRecord) return;
  if(tcStep===3) initSigPad('tc_sig_decl');
  if(tcStep===4 && tcExpandedOfficer!==null) initSigPad('tc_sig_off_'+tcExpandedOfficer);
  if(tcStep===5) initSigPad('tc_sig_cert');
}

}

        ${usedElsewhere.size>0 ? `<div style="font-size:10.5px; color:var(--muted); margin-top:-8px; margin-bottom:8px;">Names already assigned elsewhere in this form are hidden to prevent one person clearing multiple slots.</div>` : ''}
        <label>TSC No.</label><input id="tc_off_tscNo_${i}" type="text" value="${esc(o.tscNo||'')}" ${ro?'disabled':''}>
        <label>Clearance Status</label>
        <select id="tc_off_clearance_${i}" ${ro?'disabled':''} onchange="tcSyncFromDOM(); render();">
          <option value="" ${clearance===''?'selected':''}>— Pending —</option>
          <option value="Cleared for release" ${clearance==='Cleared for release'?'selected':''}>Cleared for release</option>
          <option value="Not cleared" ${clearance==='Not cleared'?'selected':''}>Not cleared</option>
        </select>
        <label>Comment</label>
        <textarea id="tc_off_comment_${i}" placeholder="Reason, outstanding item, or note (required if not cleared)" ${ro?'disabled':''}>${esc(o.comment||'')}</textarea>
        <label>Signature</label>
        <canvas id="tc_sig_off_${i}" style="width:100%; height:120px; border:1.5px dashed var(--border); border-radius:10px; background:#fff; touch-action:none;"></canvas>
        ${tcSigNote(o.signature)}
        ${!ro ? `<div class="row" style="margin-top:6px;"><button class="btn-sm btn-outline" onclick="tcClearSigField('tc_sig_off_${i}','officers.${i}.signature')">Clear</button></div>` : ''}
        <label>Date</label><input id="tc_off_date_${i}" type="date" value="${esc(o.date)}" ${ro?'disabled':''}>
        <div class="row" style="margin-top:8px; font-size:12.5px;">
          <input type="checkbox" id="tc_off_stamped_${i}" ${o.stamped?'checked':''} ${ro?'disabled':''}>
          <label for="tc_off_stamped_${i}" style="margin:0;">Official stamp applied</label>
        </div>
        <button class="btn-primary" style="width:100%; margin-top:12px;" onclick="tcToggleOfficer(${i})">✓ Save &amp; Close</button>
      </div>`;
    }).join('');
  } else if(tcStep===5){
    const c = r.certification;
    body = `
    <p style="font-size:12.5px; color:var(--muted);">I certify that the above teacher has completed the required station clearance and handover to the best of my knowledge, subject to any outstanding matter recorded on this form.</p>
    <label>Head of Institution — Name</label><input id="tc_headName" type="text" value="${esc(c.headName)}" ${ro?'disabled':''}>
    <label>Signature</label>
    <canvas id="tc_sig_cert" style="width:100%; height:130px; border:1.5px dashed var(--border); border-radius:10px; background:#fff; touch-action:none;"></canvas>
    ${tcSigNote(c.signature)}
    ${!ro ? `<div class="row" style="margin-top:6px;"><button class="btn-sm btn-outline" onclick="tcClearSigField('tc_sig_cert','certification.signature')">Clear</button></div>` : ''}
    <label>Date</label><input id="tc_certDate" type="date" value="${esc(c.date)}" ${ro?'disabled':''}>
    <div class="row" style="margin-top:8px; font-size:12.5px;">
      <input type="checkbox" id="tc_certStamped" ${c.stamped?'checked':''} ${ro?'disabled':''}>
      <label for="tc_certStamped" style="margin:0;">Official stamp applied</label>
    </div>
    `;
  }
  return `
    <div class="row" style="overflow-x:auto; margin-bottom:12px; flex-wrap:nowrap;">${stepperHtml}</div>
    <div class="card">${body}</div>
    <div class="row" style="margin-top:10px;">
      ${tcStep>0 ? `<button class="btn-outline" style="flex:1;" onclick="tcGoStep(${tcStep-1})">← Back</button>` : ''}
      ${tcStep<TC_STEPS.length-1 ? `<button class="btn-primary" style="flex:1;" onclick="tcGoStep(${tcStep+1})">Next →</button>` : (canTCEdit() ? `<button class="btn-primary" style="flex:1;" onclick="tcSaveRecord()">💾 Save Record</button>` : '')}
    </div>
    ${canTCEdit() ? `<button class="btn-outline" style="width:100%; margin-top:10px;" onclick="tcSaveAndExit()">💾 Save &amp; Back to Register</button>` : `<button class="btn-outline" style="width:100%; margin-top:10px;" onclick="setTab('register')">← Back to Register</button>`}
  `;
}
function tcFinalizeSignatures(){
  const r = tcCurrentRecord;
  r.declaration.signature = tcSigOrExisting('tc_sig_decl', r.declaration.signature);
  r.officers.forEach((o,i)=>{ o.signature = tcSigOrExisting('tc_sig_off_'+i, o.signature); });
  r.certification.signature = tcSigOrExisting('tc_sig_cert', r.certification.signature);
}
function tcSaveRecord(){
  if(!canTCEdit()){ toast('View only'); return; }
  tcSyncFromDOM();
  tcFinalizeSignatures();
  const r = tcCurrentRecord;
  if(!r.teacher.fullName){ toast("Enter the teacher's full name first"); tcStep = 0; render(); return; }
  r.status = tcComputeStatus(r);
  const ref = r.id ? db.collection('transfer_records').doc(r.id) : db.collection('transfer_records').doc();
  r.id = ref.id;
  ref.set(r).then(()=>{ toast('Clearance record saved'); }).catch(()=> toast('Save failed — check connection'));
}
function tcSaveAndExit(){
  if(!canTCEdit()){ setTab('register'); return; }
  tcSyncFromDOM();
  tcFinalizeSignatures();
  const r = tcCurrentRecord;
  r.status = tcComputeStatus(r);
  const ref = r.id ? db.collection('transfer_records').doc(r.id) : db.collection('transfer_records').doc();
  r.id = ref.id;
  ref.set(r).then(()=>{ toast('Draft saved'); }).catch(()=> toast('Save failed — check connection'));
  setTab('register');
}

function importLegacyTransferData(){

function tscUtf8B64Decode(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function mountTSCIframe(){
  const frame = document.getElementById('tscEmbedFrame');
  if(!frame) return;
  try{
    frame.srcdoc = tscUtf8B64Decode(TSC_APP_HTML_B64);
    frame.onload = function(){
      if(!canEditModule('tscEntryExit')) tscApplyReadOnly(frame);
    };
  }catch(e){
    console.error('Failed to load TSC Entry & Exit app', e);
    toast('Could not load TSC Entry & Exit form');
  }
}
function tscApplyReadOnly(frame){
  try{
    const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
    if(!doc) return;
    const KEEP_ENABLED_IDS = ['searchQuery']; // read/search fields stay usable
    const BLOCK_KEYWORDS = ['save','delete','clear','newform','import','push','connect','disconnect'];
    const isBlockedButton = (el) => {
      const oc = (el.getAttribute('onclick')||'').toLowerCase();
      return BLOCK_KEYWORDS.some(k => oc.includes(k));
    };
    const lockPass = () => {
      doc.querySelectorAll('input, select, textarea').forEach(el=>{
        if(KEEP_ENABLED_IDS.includes(el.id)) return;
        if(el.type === 'file') { el.disabled = true; return; }
        el.disabled = true;
      });
      doc.querySelectorAll('canvas').forEach(el=>{ el.style.pointerEvents = 'none'; });
      doc.querySelectorAll('button').forEach(el=>{
        if(isBlockedButton(el)) el.disabled = true;
      });
    };
    lockPass();
    // Re-apply whenever the embedded app adds new elements (search results list, reloaded form, etc.)
    const observer = new MutationObserver(lockPass);
    observer.observe(doc.body, { childList:true, subtree:true });
    // Visible banner so it's clear why fields don't respond
    if(!doc.getElementById('tscReadOnlyBanner')){
      const banner = doc.createElement('div');
      banner.id = 'tscReadOnlyBanner';
      banner.textContent = '🔒 View only — your role does not have edit access to this form';
      banner.style.cssText = 'position:sticky;top:0;z-index:9999;background:#7a1f1f;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:600;';
      doc.body.insertBefore(banner, doc.body.firstChild);
    }
  }catch(e){
    console.error('Could not enforce view-only mode on TSC form', e);
  }
